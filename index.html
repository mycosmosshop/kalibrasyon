      (async () => {
        'use strict';
        // --- Gelişmiş Service Worker Kayıt Mantığı ---
        
        // 1. Tarayıcı desteğini kontrol et.
        if (!('serviceWorker' in navigator)) {
          console.log('Service Worker bu tarayıcı tarafından desteklenmiyor.');
          return;
        }

        // 2. SW'nin devre dışı bırakılacağı ortamları belirle.
        const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
        if (location.protocol === 'file:' || (location.protocol === 'http:' && !isLocalhost)) {
          console.warn('Service Worker bu ortam için devre dışı bırakıldı (file protocol veya localhost olmayan http).');
          window.__SW_DISABLED__ = true;
          return;
        }
        
        try {
          // 3. Çakışmaları önlemek için farklı kökenlerden (origin) gelen eski SW'leri kaldır.
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            if (registration.active) {
              try {
                const scriptURL = new URL(registration.active.scriptURL);
                if (scriptURL.origin !== location.origin) {
                  console.log('Farklı kökenden gelen eski service worker kaydı siliniyor:', scriptURL.origin);
                  await registration.unregister();
                }
              } catch (e) {
                 console.warn('Eski bir kayıt için scriptURL ayrıştırılamadı, silme işlemi atlanıyor.', e);
              }
            }
          }

          // 4. Yeni service worker'ı kaydet.
          const swUrl = new URL('sw.js', location.origin);
          const reg = await navigator.serviceWorker.register(swUrl);
          
          // Kayıt nesnesini, uygulamanın kullanabilmesi için global olarak erişilebilir yap.
          window.__SW_REGISTRATION__ = reg;
          
          // 5. Güncellemeleri dinle.
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            if (installingWorker) {
              installingWorker.onstatechange = () => {
                // Yeni worker yüklendiğinde ve sayfayı kontrol eden eski bir worker varsa...
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Yeni bir sürüm mevcut. Güncellemeye hazır.');
                  // React uygulamasının "Güncelle" butonu göstermesi için global bir işaret ayarla.
                  window.__SW_HAS_UPDATE__ = true;
                }
              };
            }
          };
        } catch (error) {
          console.warn('Service Worker kaydı başarısız oldu:', error);
        }
      })();

// === Google Drive PDF Yükleme (GAS üzerinden) ===
let _gasUrl = '';

async function uploadToDrive(file, subfolder) {
  const gasUrl = _gasUrl || (() => { try { return JSON.parse(localStorage.getItem('settings') || '{}').serviceUrl || ''; } catch(e) { return ''; } })();
  if (!gasUrl) throw new Error('GAS Servis URL ayarlanmamış (Ayarlar → Servis URL)');
  const base64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = ev => res(ev.target.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const resp = await fetch(gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'uploadToDrive', filename: file.name, base64, mimeType: file.type || 'application/pdf', subfolder: subfolder || '' })
  });
  if (!resp.ok) throw new Error('GAS HTTP ' + resp.status);
  const data = await resp.json();
  if (!data.success) throw new Error(data.error || 'Drive yükleme başarısız');
  return data;
}

async function deleteFromDrive(fileId) {
  const gasUrl = _gasUrl || (() => { try { return JSON.parse(localStorage.getItem('settings') || '{}').serviceUrl || ''; } catch(_) { return ''; } })();
  if (!gasUrl || !fileId) return { success: false, error: 'GAS URL veya dosya ID yok' };
  const resp = await fetch(gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'deleteFromDrive', fileId })
  });
  if (!resp.ok) throw new Error('GAS HTTP ' + resp.status);
  return await resp.json();
}

const formatDateForDisplay = (dateString) => {
  if (!dateString || dateString === 'N/A') return 'N/A';
  try {
    const date = new Date(dateString);
    if (isNaN(date.getTime())) {
      return dateString;
    }
    return date.toLocaleDateString('tr-TR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
    });
  } catch (e) {
    return dateString;
  }
};

const fileToBase64 = (file) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
};

const calculateNextCalibrationDate = (lastDate, intervalMonths) => {
    if (!lastDate) return null;
    const date = new Date(lastDate);
    if (isNaN(date.getTime())) {
        return null;
    }
    date.setMonth(date.getMonth() + parseInt(intervalMonths, 10));
    return date;
};

const generateSequentialId = (instruments) => {
    const prefix = 'SF';
    const existingIds = instruments
        .map(inst => inst.id)
        .filter(id => typeof id === 'string' && id.startsWith(prefix))
        .map(id => parseInt(id.substring(prefix.length), 10))
        .filter(num => !isNaN(num));

    const maxId = existingIds.length > 0 ? Math.max(...existingIds) : 0;
    const newIdNumber = maxId + 1;
    return `${prefix}${newIdNumber.toString().padStart(5, '0')}`;
};

const calculateEffectiveDeviation = (deviation, uncertainty) => {
    // Ondalık (floating-point) hatasını temizle: 0.42000000000000004 -> 0.42
    return parseFloat(((Math.abs(Number(deviation) || 0)) + (Number(uncertainty) || 0)).toFixed(6));
};

const getCalibrationResult = (effectiveDeviation, permissibleDeviation) => {
    const epsilon = 1e-9;
    if (effectiveDeviation < permissibleDeviation - epsilon) {
        return CalibrationResult.COMPLIANT;
    } else if (Math.abs(effectiveDeviation - permissibleDeviation) < epsilon) {
        return CalibrationResult.MARGINAL;
    } else {
        return CalibrationResult.NON_COMPLIANT;
    }
};

const ToastContainer = () => {
    const [toasts, setToasts] = useState([]);
    
    useEffect(() => {
        const handleShow = (e) => {
            setToasts(prev => [...prev, e.detail]);
        };
        toastService.events.addEventListener('show', handleShow);
        return () => toastService.events.removeEventListener('show', handleShow);
    }, []);

    const handleDismiss = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
    };

    return (
        e("div", { id: "toast-container", className: "fixed top-5 right-5 z-[100]" },
            toasts.map(toast => (
                e(Toast, { key: toast.id, ...toast, onDismiss: () => handleDismiss(toast.id) })
            ))
        )
    );
};


// --- Local Storage Hook ---
function useLocalStorage(key, initialValue) {
    const [storedValue, setStoredValue] = useState(() => {
        if (typeof window === 'undefined') {
            return initialValue;
        }
        try {
            const item = window.localStorage.getItem(key);
            return item ? JSON.parse(item) : initialValue;
        } catch (error) {
            console.error(`'${key}' anahtarı için localStorage'dan veri okunurken hata oluştu:`, error);
            toastService.warning(`'${key}' verisi okunurken bir hata oluştu. Veriler varsayılana sıfırlanmış olabilir.`);
            return initialValue;
        }
    });
    const setValue = (value) => {
        try {
            const valueToStore = value instanceof Function ? value(storedValue) : value;
            setStoredValue(valueToStore);
            if (typeof window !== 'undefined') {
                window.localStorage.setItem(key, JSON.stringify(valueToStore));
            }
        } catch (error) {
            console.error(`'${key}' anahtarı için localStorage'a veri yazılırken hata oluştu:`, error);
            if (error instanceof DOMException && (error.name === 'QuotaExceededError' || error.name === 'NS_ERROR_DOM_QUOTA_REACHED')) {
                 toastService.error('Veri kaydedilemedi. Tarayıcı depolama alanı dolu. Lütfen büyük dosyaları silin veya verileri dışa aktarıp temizleyin.');
            } else {
                 toastService.error(`'${key}' verisi kaydedilirken beklenmedik bir hata oluştu.`);
            }
        }
    };
    return [storedValue, setValue];
}

const EditableTagList = ({ title, items, onItemsChange, placeholder }) => {
    const [newItem, setNewItem] = useState('');

    const handleAddItem = () => {
        const trimmed = newItem.trim();
        if (trimmed && !items.includes(trimmed)) {
            onItemsChange([...items, trimmed]);
            setNewItem('');
        }
    };

    const handleRemoveItem = (itemToRemove) => {
        onItemsChange(items.filter(item => item !== itemToRemove));
    };

    return (

            e("h4", { className: "text-md font-semibold text-slate-700 dark:text-slate-300" }, title),
            e("div", { className: "flex gap-2" },
                e(FormInput, {
                    id: `new-${title.toLowerCase().replace(' ', '-')}`,
                    type: "text",
                    value: newItem,
                    onChange: (e) => setNewItem(e.target.value),
                    placeholder: placeholder,

                    onKeyDown: (e) => { if (e.key === 'Enter') { e.preventDefault(); handleAddItem(); } }
                }),
                e("button", { type: "button", onClick: handleAddItem, className: "px-4 py-2 text-sm font-semibold text-white bg-sky-600 rounded-md hover:bg-sky-700 transition-colors flex-shrink-0" }, "Ekle")
            ),
            e("div", { className: "flex flex-wrap gap-2 p-2 bg-slate-100 dark:bg-slate-900/50 rounded-md min-h-[40px]" },
                items.length > 0 ? items.map(item => (
                    e("span", { key: item, className: "flex items-center gap-1.5 bg-slate-200 dark:bg-slate-700 text-sm font-medium px-2 py-1 rounded-full" },

                        )
                    )
                )) : e("span", { className: "text-sm text-slate-500 p-1" }, "Henüz öğe eklenmedi.")
            )
        )
    );
};

    const getInstrumentStatus = useCallback((instrument, reminderDays) => {
        const { lastCalibrationDate, calibrationInterval } = instrument;
        if (!lastCalibrationDate) return CalibrationStatus.PENDING;

        if (!nextCalibrationDate) return CalibrationStatus.PENDING;

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const diffTime = nextCalibrationDate.getTime() - today.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) return CalibrationStatus.OVERDUE;
        if (diffDays <= (reminderDays || 30)) return CalibrationStatus.DUE_SOON;
        return CalibrationStatus.OK;
    }, []);

    const instrumentsWithDetails = useMemo(() => {
        // ensure relevant records cover both calibration & verification
const __grouped = new Map();
(calibrationRecords || []).forEach(r => { if (!r || !r.instrumentId) return; const a = __grouped.get(r.instrumentId) || []; a.push(r); __grouped.set(r.instrumentId, a); });
return instruments.map(instrument => {
            const status = getInstrumentStatus(instrument, settings.reminderDays);
            const nextCalibrationDate = instrument.lastCalibrationDate
                ? calculateNextCalibrationDate(instrument.lastCalibrationDate, instrument.calibrationInterval)
                : null;
            return {
                ...instrument,

                nextCalibrationDate: nextCalibrationDate ? dateKeyOf(nextCalibrationDate) : 'N/A',
            };
        });
    }, [instruments, getInstrumentStatus, settings.reminderDays]);
    
    const handleFullBackupExport = useCallback(() => {
        if (instruments.length === 0 && calibrationRecords.length === 0) {
            console.log("Otomatik yedekleme atlandı: Kaydedilecek veri yok.");
            return;
        }

        const allInstrumentsWithDetails = instruments.map(instrument => {
            const status = getInstrumentStatus(instrument, settings.reminderDays);
            const nextCalibrationDate = instrument.lastCalibrationDate
                ? calculateNextCalibrationDate(instrument.lastCalibrationDate, instrument.calibrationInterval)
                : null;
            return {
                ...instrument,
                status,
                nextCalibrationDate: nextCalibrationDate ? dateKeyOf(nextCalibrationDate) : 'N/A',
            };
        });

        const instrumentHeaders = ALL_INSTRUMENT_COLUMNS.filter(c => c.key !== 'image').map(c => ({ key: c.key, label: c.label, type: 'instrument' }));
        const recordHeaders = ALL_CALIBRATIONS_COLUMNS.filter(c => c.key !== 'instrumentName' && c.key !== 'instrumentSerial').map(c => ({ key: c.key, label: c.label, type: 'record' }));
        const finalHeaders = [...instrumentHeaders, ...recordHeaders];
        const headersForSheet = finalHeaders.map(h => h.label);
        const relevantRecords = [...calibrationRecords].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
        
        const createRow = (instrument, record = null) => {
            const refInstrument = record?.referenceInstrumentId ? instruments.find(i => i.id === record.referenceInstrumentId) : null;
            const deviation = Number(record?.deviation) || 0;
            const uncertainty = Number(record?.uncertainty) || 0;
            const effectiveDeviation = calculateEffectiveDeviation(deviation, uncertainty);
            const totalDeviationForDisplay = effectiveDeviation * (deviation < 0 ? -1 : 1);
            
            const recordWithDetails = record ? {
                ...record,
                referenceInstrumentName: refInstrument ? `${refInstrument.name} (SN: ${refInstrument.serialNumber})` : (record.referenceInstrumentId || ''),
                totalDeviation: totalDeviationForDisplay,
            } : {};

            const rowData = {};
            finalHeaders.forEach(header => {
                let value;
                if (header.type === 'instrument') {
                    value = instrument[header.key];
                    if (header.key === 'lastCalibrationDate' || header.key === 'nextCalibrationDate') value = formatDateForDisplay(value);
                } else if (record) {
                    value = recordWithDetails[header.key];
                    if (header.key === 'date') value = formatDateForDisplay(value);
                } else {
                    value = '';
                }
                rowData[header.label] = value ?? '';
            });
            return rowData;
        };

        const dataForSheet = allInstrumentsWithDetails.flatMap(instrument => {
            const instrumentRecords = relevantRecords.filter(r => r.instrumentId === instrument.id);
            if (instrumentRecords.length === 0) {
                return [createRow(instrument, null)];
            } else {
                return instrumentRecords.map(record => createRow(instrument, record));
            }
        });

        if (dataForSheet.length === 0) return;

        const wb = XLSX.utils.book_new();
        const sheetData = [headersForSheet, ...dataForSheet.map(row => headersForSheet.map(header => row[header]))];
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
        
        ws['!cols'] = headersForSheet.map((h, i) => ({ wch: Math.min(sheetData.reduce((max, r) => Math.max(max, String(r[i] || '').length), h.length), 80) + 2 }));
        XLSX.utils.book_append_sheet(wb, ws, "Kalibrasyon_Yedek");
        const timestamp = new Date().toISOString().replace(/[:.T-]/g, '').substring(0, 14);
        XLSX.writeFile(wb, `Kalibrasyon_Yedek_${timestamp}.xlsx`);

        const originalInstrument = editingInstrumentId ? instruments.find(i => i.id === editingInstrumentId) : null;

        setInstruments(prev => {
            if (editingInstrumentId) {
                return prev.map(i => (i.id === instrument.id ? instrument : i));

                return [...prev, { ...instrument, id: generateSequentialId(prev) }];

        if (originalInstrument && originalInstrument.permissibleDeviation !== instrument.permissibleDeviation) {

            setCalibrationRecords(prevRecords => 
                prevRecords.map(record => {

                        const effectiveDeviation = calculateEffectiveDeviation(record.deviation, record.uncertainty);
                        const newResult = getCalibrationResult(effectiveDeviation, instrument.permissibleDeviation);
                        if (record.result !== newResult) {

                    return record;
                })
            );

        setInstrumentFormOpen(false);
        setEditingInstrumentId(null);

        setEditingRecord(record);

    const handleSaveRecord = (record) => {
        const instrument = instruments.find(i => i.id === record.instrumentId);
        if (!instrument) {
            toastService.error("Kaydedilecek cihaz bulunamadı.");
            return;
        }

        const effectiveDeviation = calculateEffectiveDeviation(record.deviation, record.uncertainty);
        const finalResult = getCalibrationResult(effectiveDeviation, instrument.permissibleDeviation);
        const recordWithResult = { ...record, result: finalResult };

        let updatedRecords;
        if (editingRecord) {
            updatedRecords = calibrationRecords.map(r => (r.id === recordWithResult.id ? recordWithResult : r));
        } else {
            const newRecord = { ...recordWithResult, id: Date.now().toString() };
            updatedRecords = [...calibrationRecords, newRecord];
        }
        setCalibrationRecords(updatedRecords);

        if (record.recordType === RecordType.CALIBRATION) {
            setInstruments(prevInstruments => {
                const recordsForThisInstrument = updatedRecords.filter(r => r.instrumentId === record.instrumentId && r.recordType === RecordType.CALIBRATION);
                const latestRecord = recordsForThisInstrument.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime())[0];
                
                return prevInstruments.map(inst => {
                    if (inst.id === record.instrumentId) {
                        return { ...inst, lastCalibrationDate: latestRecord ? latestRecord.date : '' };
                    }
                    return inst;
                });
            });
        }

        setCalibrationFormOpen(false);
        setEditingRecord(null);
        setInstrumentIdForNewRecord(null);
    
    // --- Sync verification date to instrument.lastCalibrationDate if it is newer ---
    try {
        const rec = record || {};
        if ((rec.recordType === RecordType.VERIFICATION) || (rec.type === RecordType.VERIFICATION) || (rec.recordType === 'Doğrulama') || (rec.type === 'Doğrulama')) {
            if (rec.date) {
                setInstruments(prev => prev.map(inst => {
                    if (!inst || inst.id !== rec.instrumentId) return inst;
                    const prevDate = inst.lastCalibrationDate ? new Date(inst.lastCalibrationDate) : null;
                    const newDate = new Date(rec.date);
                    if (!prevDate || (newDate.getTime() > prevDate.getTime())) {
                        const keyer = (typeof window !== 'undefined' && typeof window.dateKeyOf === 'function') ? window.dateKeyOf : (d => d.toISOString().slice(0,10));
                        return { ...inst, lastCalibrationDate: keyer(newDate) };
                    }
                    return inst;
                }));
            }
        }
    } catch (e) {
        console.warn('Verification sync failed', e);
    }
    
};

    const handleDeleteRecord = (id) => {

    const handleBulkInstrumentEditSave = (updatedFields) => {
        const cleanUpdatedFields = Object.fromEntries(
            Object.entries(updatedFields).filter(([_, v]) => v !== null && v !== undefined && v !== '')
        );
        const permissibleDeviationChanged = 'permissibleDeviation' in cleanUpdatedFields;

        setInstruments(prev => prev.map(inst => {
            if (editingInstrumentIdsForBulk.includes(inst.id)) {
                return { ...inst, ...cleanUpdatedFields };
            }
            return inst;
        }));

        if (permissibleDeviationChanged) {
            toastService.info(`İzin verilen sapma toplu olarak güncellendi. İlgili kayıtlar yeniden değerlendiriliyor.`);
            const newPermissibleDeviation = cleanUpdatedFields.permissibleDeviation;
            const affectedInstrumentIds = new Set(editingInstrumentIdsForBulk);

            setCalibrationRecords(prevRecords => 
                prevRecords.map(record => {
                    if (affectedInstrumentIds.has(record.instrumentId)) {
                        const effectiveDeviation = calculateEffectiveDeviation(record.deviation, record.uncertainty);
                        const newResult = getCalibrationResult(effectiveDeviation, newPermissibleDeviation);
                        if (record.result !== newResult) {
                            return { ...record, result: newResult };
                        }
                    }
                    return record;
                })
            );
        }

        setBulkInstrumentEditModalOpen(false);
        setEditingInstrumentIdsForBulk([]);
        toastService.success(`${editingInstrumentIdsForBulk.length} cihaz başarıyla güncellendi.`);
    };

    const handleBulkRecordEditSave = (updatedFields) => {
        let affectedInstrumentIds = new Set();

        const newRecords = calibrationRecords.map(rec => {
            if (editingRecordIdsForBulk.includes(rec.id)) {
                 const cleanUpdatedFields = Object.fromEntries(
                    Object.entries(updatedFields).filter(([_, v]) => v !== null && v !== undefined && v !== '')
                );

                if ('recordType' in cleanUpdatedFields && rec.recordType !== cleanUpdatedFields.recordType) {
                    affectedInstrumentIds.add(rec.instrumentId);
                }
                return { ...rec, ...cleanUpdatedFields };
            }
            return rec;
        });
        setCalibrationRecords(newRecords);

        if (affectedInstrumentIds.size > 0) {
            setInstruments(prevInstruments => {
                return prevInstruments.map(inst => {
                    if (affectedInstrumentIds.has(inst.id)) {
                        const latestRecord = newRecords
                            .filter(r => r.instrumentId === inst.id && r.recordType === RecordType.CALIBRATION)
                            .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime())[0];
                        return { ...inst, lastCalibrationDate: latestRecord ? latestRecord.date : '' };
                    }
                    return inst;
                });
            });

        setBulkRecordEditModalOpen(false);
        setEditingRecordIdsForBulk([]);

    const confirmDelete = () => {

        if (type === 'instrument' || type === 'bulk_instruments') {
            setInstruments(prev => prev.filter(i => !ids.includes(i.id)));
            setCalibrationRecords(prev => prev.filter(r => !ids.includes(r.instrumentId)));
        } else if (type === 'record' || type === 'bulk_records') {
            const recordsToDelete = calibrationRecords.filter(r => ids.includes(r.id));
            if (recordsToDelete.length === 0) {
                setConfirmDeleteOpen(false);
                setItemToDelete(null);
                return;
            }
    
            const affectedInstrumentIds = new Set(
                recordsToDelete
                    .filter(r => r.recordType === RecordType.CALIBRATION)
                    .map(r => r.instrumentId)
            );
    
            const newRecords = calibrationRecords.filter(r => !ids.includes(r.id));
            setCalibrationRecords(newRecords);
    
            if (affectedInstrumentIds.size > 0) {
                setInstruments(prevInstruments => {
                    return prevInstruments.map(inst => {
                        if (affectedInstrumentIds.has(inst.id)) {
                            const latestRecord = newRecords

                                .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime())[0];
                            
                            return { ...inst, lastCalibrationDate: latestRecord ? latestRecord.date : '' };
                        }
                        return inst;
                    });
                });
            }
        }
        
        setConfirmDeleteOpen(false);
        setItemToDelete(null);

    const handleUnifiedImport = (data) => {
        const parseDateToISO = (dateInput) => {
            if (!dateInput || (typeof dateInput === 'string' && dateInput.toLowerCase() === 'gg.aa.yyyy')) return null;
            if (dateInput instanceof Date) {
                return !isNaN(dateInput.getTime()) ? dateKeyOf(dateInput) : null;
            }
            if (typeof dateInput === 'string') {
                const parts = dateInput.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
                let date;
                if (parts) {
                    date = new Date(parseInt(parts[3], 10), parseInt(parts[2], 10) - 1, parseInt(parts[1], 10));
                } else {
                    date = new Date(dateInput);
                }
                return !isNaN(date.getTime()) ? dateKeyOf(date) : null;
            }
            if (typeof dateInput === 'number') {
                const d = XLSX.SSF.parse_date_code(dateInput);
                if (d) {
                    const date = new Date(d.y, d.m - 1, d.d, d.H, d.M, d.S);
                    return !isNaN(date.getTime()) ? dateKeyOf(date) : null;
                }
            }
            return null;
        };

        const headerMap = {
            'Cihaz ID': 'id', 'Cihaz Adı': 'name', 'Seri No': 'serialNumber', 'Model': 'model',
            'Konum': 'location', 'Departman': 'department', 'Kal. Aralığı (Ay)': 'calibrationInterval',
            'İzin Verilen Sapma': 'permissibleDeviation', 'Birim': 'unit',
            'Ölçüm Aralığı': 'measurementRange', 'Çözünürlük': 'resolution', 'Prosedür': 'procedure',
            'Son Kalibrasyon Tarihi': 'lastCalibrationDate',
            'Kayıt Tipi': 'recordType', 'Tarih': 'date', 'Sonuç': 'result',
            'Firma': 'calibratingCompany', 'Kalibrasyon Firması': 'calibratingCompany',
            'Teknisyen': 'technician', 'Teknisyen / Personel': 'technician',
            'Rapor No': 'reportNumber', 'Rapor Numarası': 'reportNumber',
            'Sapma': 'deviation', 'Belirsizlik': 'uncertainty',
            'Notlar': 'notes', 'Zimmetli Personel': 'assignedPersonnel',
            'Referans Cihaz Seri No': 'referenceInstrumentSerial'
        };

        // Başlık/antet satırlarını atla: headerMap ile eşleşen ilk satırı gerçek header kabul et
        let headerRowIndex = 0;
        for (let i = 0; i < Math.min(data.length, 15); i++) {
            const candidate = data[i] || [];
            if (candidate.some(cell => headerMap[String(cell == null ? '' : cell).trim()])) {
                headerRowIndex = i;
                break;
            }
        }
        const headerRow = (data[headerRowIndex] || []).map(h => String(h == null ? '' : h).trim());
        const rows = data.slice(headerRowIndex + 1);

        const newRecords = [];
        const newInstrumentsFromExcel = new Map();
        // Seri no geçersizse (N/A, -, boş) Cihaz ID'ye göre grupla → "N/A" seri no'lu cihazlar birbirini EZMESİN
        const _validSer = (s)=>{ s=String(s==null?'':s).trim(); return (s!=='' && !['N/A','n/a','-','—','--'].includes(s)) ? s : null; };
        const _validCid = (c)=>{ c=String(c==null?'':c).trim(); return (c!=='' && !['-','—','N/A'].includes(c)) ? c : null; };
        const _grpKey = (serialV, cidV, uniq)=> _validSer(serialV) || (_validCid(cidV) ? ('CID::'+_validCid(cidV)) : ('ROW::'+uniq));
        const existingInstrumentsBySerial = new Map(instruments.map(inst => [_grpKey(inst.serialNumber, inst.providedId || inst.id, 'EX'+inst.id), inst]));
        let newInstrumentCounter = 0;
        let updatedInstrumentsMap = new Map();

        rows.forEach((row, rowIndex) => {
            const rowData = {};
            headerRow.forEach((header, index) => {
                const key = headerMap[header];
                if (key) {
                    let value = row[index];
                     if (key === 'date' || key === 'lastCalibrationDate') {
                        value = parseDateToISO(value);
                    }
                    rowData[key] = value;
                }
            });
    
            if (!rowData.serialNumber && !rowData.id && !rowData.name) {
                console.warn(`Satır ${rowIndex + 2} atlandı: boş satır (seri no / cihaz id / ad yok).`);
                return;
            }

            const { id: providedId, ...restOfRowData } = rowData;
            const realSerial = String(rowData.serialNumber || '');
            const serial = _grpKey(realSerial, providedId, 'IMP'+rowIndex); // gruplama anahtarı (seri geçersizse Cihaz ID)
            let instrumentToProcess;
            let existingInstrument = existingInstrumentsBySerial.get(serial);

            const instrumentDataFromRow = Object.fromEntries(
                Object.entries(restOfRowData).filter(([_, v]) => v !== undefined && v !== null && String(v).trim() !== '')
            );

            if (existingInstrument) {
                instrumentToProcess = { ...existingInstrument, ...instrumentDataFromRow };
                updatedInstrumentsMap.set(serial, instrumentToProcess);
            } else {
                instrumentToProcess = newInstrumentsFromExcel.get(serial);
                if (!instrumentToProcess) {
                    instrumentToProcess = {
                        id: `new_${serial}_${newInstrumentCounter++}`, // Temporary ID for linking records
                        providedId: providedId ? String(providedId) : null,
                        name: '', serialNumber: realSerial, model: '', location: '', department: '',
                        calibrationInterval: 12, permissibleDeviation: 0, unit: '', procedure: '',
                        lastCalibrationDate: '', measurementRange: '', resolution: '', image: null,
                        ...instrumentDataFromRow,
                    };
                    newInstrumentsFromExcel.set(serial, instrumentToProcess);
                }
            }

            if (rowData.date) {
                const deviation = Number(rowData.deviation) || 0;
                const uncertainty = Number(rowData.uncertainty) || 0;
                const effectiveDeviation = calculateEffectiveDeviation(deviation, uncertainty);
                const result = getCalibrationResult(effectiveDeviation, instrumentToProcess.permissibleDeviation || 0);
    
                const newRecord = {
                    id: `${Date.now()}-${rowIndex}`,
                    instrumentId: instrumentToProcess.id, // Use temp ID for now
                    date: rowData.date,
                    technician: rowData.technician || '',
                    calibratingCompany: rowData.calibratingCompany || '',
                    reportNumber: String(rowData.reportNumber || ''),
                    deviation: deviation,
                    uncertainty: uncertainty,
                    notes: rowData.notes || '',
                    recordType: Object.values(RecordType).includes(rowData.recordType) ? rowData.recordType : RecordType.CALIBRATION,
                    result: result,
                    assignedPersonnel: rowData.assignedPersonnel || '',
                    reportFile: null,
                    referenceInstrumentId: '',
                };
                
                if (rowData.referenceInstrumentSerial) {
                    const allPossibleInstruments = [...instruments, ...Array.from(newInstrumentsFromExcel.values())];
                    const refInst = allPossibleInstruments.find(i => i.serialNumber === rowData.referenceInstrumentSerial);
                    if (refInst) newRecord.referenceInstrumentId = refInst.id;
                }
                newRecords.push(newRecord);
            }
        });
        
        if (updatedInstrumentsMap.size === 0 && newInstrumentsFromExcel.size === 0 && newRecords.length === 0) {
            toastService.info("İçe aktarılacak yeni veya güncellenecek veri bulunamadı.");
            setDataImportOpen(false);
            return;
        }
        
        let finalInstruments = instruments.map(inst => updatedInstrumentsMap.get(String(inst.serialNumber)) || inst);
        const newInstrumentsToAdd = Array.from(newInstrumentsFromExcel.values());

        const allCurrentIds = new Set(finalInstruments.map(i => i.id));
        const newInstrumentsWithFinalIds = [];
        
        const tempInstrumentPoolForIdGeneration = [...finalInstruments];

        for (const instToAdd of newInstrumentsToAdd) {
            const tempId = instToAdd.id;
            const providedId = instToAdd.providedId;
            let finalId;

            if (providedId && !allCurrentIds.has(providedId)) {
                finalId = providedId;
            } else {
                if (providedId) {
                    toastService.warning(`Cihaz ID '${providedId}' zaten kullanılıyor veya Excel dosyasında tekrar ediyor. Otomatik ID atanacak.`);
                }
                finalId = generateSequentialId(tempInstrumentPoolForIdGeneration);
            }

            allCurrentIds.add(finalId);
            newRecords.forEach(rec => { if (rec.instrumentId === tempId) { rec.instrumentId = finalId; } });
            const { providedId: _, ...restInst } = instToAdd;
            const finalInstrument = { ...restInst, id: finalId };
            newInstrumentsWithFinalIds.push(finalInstrument);
            tempInstrumentPoolForIdGeneration.push(finalInstrument);
        }
        
        finalInstruments.push(...newInstrumentsWithFinalIds);
        const allRecords = [...calibrationRecords, ...newRecords];
        
        const affectedInstrumentSerials = new Set([...updatedInstrumentsMap.keys(), ...newInstrumentsFromExcel.keys()]);

        finalInstruments = finalInstruments.map(inst => {
            if (affectedInstrumentSerials.has(String(inst.serialNumber))) {
                const latestCalibrationRecord = allRecords
                    .filter(r => r.instrumentId === inst.id && r.recordType === RecordType.CALIBRATION)
                    .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime())[0];
                
                const finalDate = latestCalibrationRecord ? latestCalibrationRecord.date : inst.lastCalibrationDate;
                return { ...inst, lastCalibrationDate: finalDate || '' };
            }
            return inst;
        });

        const newInstrumentCount = newInstrumentsWithFinalIds.length;
        const updatedInstrumentCount = updatedInstrumentsMap.size;

        setInstruments(finalInstruments);
        setCalibrationRecords(allRecords);
    
        toastService.success(`${newInstrumentCount} yeni cihaz, ${updatedInstrumentCount} güncellenen cihaz, ${newRecords.length} yeni kayıt işlendi.`);
        setDataImportOpen(false);
    };

    const handleExport = async (instrumentsToExport) => {
        const { selectedInstrumentColumns, selectedRecordColumns } = instrumentsToExport;
        if (selectedInstrumentColumns.length === 0 && selectedRecordColumns.length === 0) {
            toastService.warning("Dışa aktarmak için en az bir sütun seçmelisiniz.");
            return;
        }
    
        const instrumentHeaders = ALL_INSTRUMENT_COLUMNS
            .filter(c => selectedInstrumentColumns.includes(c.key) && c.key !== 'image')
            .map(c => ({ key: c.key, label: c.label, type: 'instrument' }));
        
        const recordHeaders = ALL_CALIBRATIONS_COLUMNS
            .filter(c => selectedRecordColumns.includes(c.key))
            .filter(c => c.key !== 'instrumentName' && c.key !== 'instrumentSerial')
            .map(c => ({ key: c.key, label: c.label, type: 'record' }));
    
        const finalHeaders = [...instrumentHeaders, ...recordHeaders];
        const headersForSheet = finalHeaders.map(h => h.label);
    
        const createRow = (instrument, record = null) => {
            const refInstrument = record?.referenceInstrumentId ? instruments.find(i => i.id === record.referenceInstrumentId) : null;
            const deviation = Number(record?.deviation) || 0;
            const uncertainty = Number(record?.uncertainty) || 0;
            const effectiveDeviation = calculateEffectiveDeviation(deviation, uncertainty);
            const totalDeviationForDisplay = effectiveDeviation * (deviation < 0 ? -1 : 1);
            
            const recordWithDetails = record ? {
                ...record,
                referenceInstrumentName: refInstrument ? `${refInstrument.name} (SN: ${refInstrument.serialNumber})` : (record.referenceInstrumentId || ''),
                totalDeviation: totalDeviationForDisplay,
            } : {};
    
            const rowData = {};
            finalHeaders.forEach(header => {
                let value;
                if (header.type === 'instrument') {
                    value = instrument[header.key];
                    if (header.key === 'lastCalibrationDate' || header.key === 'nextCalibrationDate') {
                        value = formatDateForDisplay(value);
                    }
                } else if (record) {
                    value = recordWithDetails[header.key];
                     if (header.key === 'date') {
                        value = formatDateForDisplay(value);
                    }
                } else {
                    value = '';
                }
                rowData[header.label] = value ?? '';
            });
            return rowData;
        };
        
        const exportedInstrumentIds = new Set(instrumentsToExport.instrumentsToExport.map(i => i.id));
        const relevantRecords = calibrationRecords
            .filter(record => exportedInstrumentIds.has(record.instrumentId))
            .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
        
        const dataForSheet = instrumentsToExport.instrumentsToExport.flatMap(instrument => {
            const instrumentRecords = relevantRecords.filter(r => r.instrumentId === instrument.id);
            if (instrumentRecords.length === 0) {
                return [createRow(instrument, null)];
            } else {
                return instrumentRecords.map(record => createRow(instrument, record));
            }
        });
    
        if (dataForSheet.length === 0) {
            toastService.warning("Dışa aktarılacak veri bulunamadı.");
            return;
        }
        
        const wb = XLSX.utils.book_new();
        const sheetData = [
            headersForSheet,
            ...dataForSheet.map(row => headersForSheet.map(header => row[header]))
        ];
        const ws = XLSX.utils.aoa_to_sheet(sheetData);
    
        const columnWidths = headersForSheet.map((header, i) => {
            const isLongTextColumn = header === 'Notlar' || header === 'Prosedür';
            const allValues = sheetData.map(row => row[i]);
            const maxLength = allValues.reduce((max, val) => Math.max(max, val ? String(val).length : 0), 0);
            return { wch: isLongTextColumn ? Math.min(maxLength, 50) : Math.min(maxLength, 80) + 2 };
        });
        ws['!cols'] = columnWidths;
    
        const range = XLSX.utils.decode_range(ws['!ref']);
        for (let R = range.s.r; R <= range.e.r; ++R) {
            for (let C = range.s.c; C <= range.e.c; ++C) {
                const cell_ref = XLSX.utils.encode_cell({ c: C, r: R });
                if (!ws[cell_ref]) continue;
    
                const headerLabel = headersForSheet[C];
                const isLongTextColumn = headerLabel === 'Notlar' || headerLabel === 'Prosedür';
    
                ws[cell_ref].s = {
                    border: {
                        top: { style: "thin", color: { auto: 1 } },
                        bottom: { style: "thin", color: { auto: 1 } },
                        left: { style: "thin", color: { auto: 1 } },
                        right: { style: "thin", color: { auto: 1 } }
                    },
                    alignment: { vertical: "top" }
                };
    
                if (R === 0) {
                    ws[cell_ref].s.font = { bold: true, color: { rgb: "FFFFFF" } };
                    ws[cell_ref].s.fill = { fgColor: { rgb: "4A90E2" } };
                }
                
                if (isLongTextColumn && R > 0) {
                    ws[cell_ref].s.alignment.wrapText = true;
                }
            }
        }
    
        XLSX.utils.book_append_sheet(wb, ws, "Dışa Aktarılan Veriler");
        XLSX.writeFile(wb, "Kalibrasyon_Raporu.xlsx");
        setExportOpen(false);
    };

    const handlePL12Export = async (instrumentsList) => {

            // Kenarlıklar

            const md = { style: 'medium', color: { argb: 'FF000000' } };
            const allThin = { top: th, bottom: th, left: th, right: th };
            const allMed  = { top: md, bottom: md, left: md, right: md };

            // Sütun genişlikleri
            [5,22,14,16,18,14,15,7,10,14,10,14,12,11,20,16,9,11,14,13,22,28].forEach(function(w, i) {
                ws.getColumn(i + 1).width = w;

            // Satır yükseklikleri (antet 4 satır + sütun başlığı)
            ws.getRow(1).height = 40;
            ws.getRow(2).height = 28;
            ws.getRow(3).height = 18;
            ws.getRow(4).height = 18;
            ws.getRow(5).height = 36;

            // ── Logo: A1:C4 ─────────────────────────────────────────────────────
            ws.mergeCells('A1:C4');

            logoC.value = 'SANİFOAM A.Ş.';
            logoC.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 16 };
            logoC.fill = navyFill;
            logoC.alignment = { horizontal: 'center', vertical: 'middle' };
            logoC.border = allMed;

            // ── Başlık D1:R1 ────────────────────────────────────────────────────
            ws.mergeCells('D1:R1');
            var titC = ws.getCell('D1');
            titC.value = 'KALİTE YÖNETİM SİSTEMİ DOKÜMANTASYONU';
            titC.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 11 };
            titC.fill = navyFill;
            titC.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
            titC.border = allThin;

            // ── Alt başlık D2:R4 (3 boş satır birleştirildi) ────────────────────
            ws.mergeCells('D2:R4');
            var subC = ws.getCell('D2');
            subC.value = 'MUAYENE/ÖLÇME/DENEY TEÇHİZATLARI KONTROL PLANI (' + new Date().getFullYear() + ')';
            subC.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 12 };
            subC.fill = midFill;
            subC.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
            subC.border = allThin;

            // ── Bilgi tablosu S-T=Etiket / U-V=Değer ────────────────────────────
            var sayfa = '1/' + (Math.ceil(list.length / 30) || 1);
            var infoRows = [
                ['DOKÜMAN NO',    'PL12'],
                ['YAYIN TARİHİ',  '18.12.2006'],
                ['REV. NO/TARİH', '10/12.12.2019'],
                ['SAYFA',         sayfa],
            ];
            infoRows.forEach(function(row, i) {
                var er = i + 1;
                ws.mergeCells('S' + er + ':T' + er);
                var lbl = ws.getCell('S' + er);
                lbl.value = row[0];
                lbl.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 9 };
                lbl.fill = navyFill;
                lbl.alignment = { horizontal: 'left', vertical: 'middle' };
                lbl.border = allMed;

                ws.mergeCells('U' + er + ':V' + er);
                var val = ws.getCell('U' + er);
                val.value = row[1];
                val.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 9 };
                val.fill = navyFill;
                val.alignment = { horizontal: 'center', vertical: 'middle' };
                val.border = allMed;
            });

            // ── Sütun Başlıkları (satır 5) ───────────────────────────────────────
            var COLS = ['S.No','Cihaz Adı','Seri No','Model','Departman','Konum','Ölçüm Aralığı','Birim','İzin Ver. Sapma','Son Kalibrasyon','Kal. Aralığı (Ay)','Sıradaki Kalibrasyon','Durum','Kayıt Tipi','Kal. Firması','Rapor No','Sapma','Belirsizlik','Toplam Sapma (|S|+B)','Sonuç','Zimmetli Personel','Notlar'];
            COLS.forEach(function(name, ci) {
                var cell = ws.getCell(A(5, ci + 1));
                cell.value = name;
                cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 8 };

            list.forEach(function(inst, idx) {
                var r = 6 + idx;

                var even = idx % 2 === 0;

                var instRecs = calibrationRecords.filter(function(rec) { return rec.instrumentId === inst.id; })
                    .sort(function(a, b) { return new Date(b.date).getTime() - new Date(a.date).getTime(); });

                function sc(c, val, align, numFmt) {
                    var cell = ws.getCell(A(r, c));

                sc(4,  inst.model || '', 'left');
                sc(5,  inst.department || '', 'left');

                sc(7,  inst.measurementRange || '', 'center');
                sc(8,  inst.unit || '', 'center');

                scBold(13, inst.status || '', 'FF000000', fill(stHex.length === 6 ? stHex : stHex.slice(2)), 'center');

                    totCell.alignment = { horizontal: 'center', vertical: 'middle' };

                    var resHex = rec.result === CalibrationResult.COMPLIANT ? 'C6EFCE' : rec.result === CalibrationResult.NON_COMPLIANT ? 'FFC7CE' : rec.result === CalibrationResult.MARGINAL ? 'FFFFEB9C' : 'FFFFFF';
                    var resCell = ws.getCell(A(r, 20));
                    resCell.value = { formula: 'IF(' + A(r,17) + '="","",IF(' + A(r,19) + '<=' + A(r,9) + ',"' + CalibrationResult.COMPLIANT + '",IF(' + A(r,19) + '<=' + A(r,9) + '*1.1,"' + CalibrationResult.MARGINAL + '","' + CalibrationResult.NON_COMPLIANT + '")))' };
                    resCell.font = { bold: true, name: 'Arial', size: 9 };
                    resCell.fill = fill(resHex.length === 6 ? resHex : resHex.slice(2));
                    resCell.alignment = { horizontal: 'center', vertical: 'middle' };
                    resCell.border = allThin;
                } else {
                    sc(19, '', 'center');
                    sc(20, '', 'center');
                }

                sc(21, rec ? (rec.assignedPersonnel || '') : '', 'left');
                sc(22, rec ? (rec.notes || '') : '', 'left');
            });

            // ── İndir ────────────────────────────────────────────────────────────
            var buffer = await wb.xlsx.writeBuffer();
            var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'PL12_Techizat_Kontrol_Plani_' + new Date().getFullYear() + '.xlsx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setExportOpen(false);
        } catch(err) {
            console.error('PL12 export hatası:', err);
            toastService.error('Excel oluşturulurken hata: ' + err.message);
        }
    };

                - Cihaz Adı: ${instrumentData.name}
                - Model: ${instrumentData.model}
                - Ölçüm Aralığı: ${instrumentData.measurementRange || 'Belirtilmemiş'}
                - Çözünlük: ${instrumentData.resolution || 'Belirtilmemiş'}
                Prosedür, hazırlık, kalibrasyon adımları, veri toplama ve sonuçların değerlendirilmesi bölümlerini içermelidir. Prosedürü madde madde ve anlaşılır bir dilde yaz.`;
            
            const response = await ai.models.generateContent({
                model: 'gemini-2.5-flash',
                contents: prompt,
            });
            setProcedure(response.text);
        } catch (error) {
            console.error("Gemini API hatası:", error);
            toastService.error("Prosedür oluşturulurken bir hata oluştu. Lütfen daha sonra tekrar deneyin.");
        } finally {
            setIsGenerating(false);
        }
    };
    
    const handleSendImmediateReport = useCallback(async (currentSettings, devices, subjectOverride) => {
        const { serviceUrl, reminderDays, toList } = currentSettings;
        if (!serviceUrl) {
            return { message: 'Servis URL adresi gereklidir.', type: 'error' };
        }
        if (devices.length === 0) {
            return { message: 'Gönderilecek cihaz bulunmuyor.', type: 'info' };
        }

        const recipients = typeof toList === 'string'
            ? toList.split(',').map(e => e.trim()).filter(Boolean)
            : [];

        if (recipients.length === 0) {
            return { message: 'Alıcı e-posta adresi bulunamadı. Lütfen ayarlardan girin.', type: 'error' };
        }

        const threshold = Number(reminderDays || 30);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);
    
        try {
            try {
                const warmUpController = new AbortController();
                const warmUpTimeoutId = setTimeout(() => warmUpController.abort(), 25000);
                await fetch(serviceUrl, { method: 'GET', signal: warmUpController.signal });
                clearTimeout(warmUpTimeoutId);
            } catch (e) {
                console.warn("Warm-up request failed or timed out. Proceeding anyway.", e);
            }
            
            const subject = subjectOverride || `Kalibrasyon — Geciken & ${threshold} gün içinde Yaklaşıyor`;
            const payload = {
                toList: recipients,
                subject,
                thresholdDays: threshold,
                devices,
            };
    
            // Google Apps Script (Gmail) mailer — CORS preflight'tan kaçınmak için no-cors + text/plain
            // (yanıt opak okunamaz; hata fırlatmazsa iyimser başarı kabul edilir, Apps Script maili gönderir)
            await fetch(serviceUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            return { message: `E-posta gönderildi (${recipients.length} alıcı, ${devices.length} cihaz). Gelmesi birkaç dakika sürebilir.`, type: 'success' };
        } catch (e) {
            clearTimeout(timeoutId);
             if (e.name === 'AbortError') {
                return { message: 'İstek zaman aşımına uğradı (60s). Sunucu yavaş olabilir veya yanıt vermiyor.', type: 'error' };
            }
            return { message: `Bağlantı hatası: ${e.message}`, type: 'error' };
        }
    }, []);

    const handleSendFilteredNotification = async (instrumentsToNotify) => {
        // ALAN ADLARI mail sablonunun (buildHtml) okudugu adlarla AYNI
        // olmali. Eskiden serial/nextCalibration gonderiliyor, sablon
        // serialNumber/nextCalibrationDate okuyordu: mailde Seri No,
        // Departman, Siradaki Kalibrasyon ve Durum sutunlari BOS geliyordu.
        const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
        const kalanGun = (t) => {
            if (!t) return null;
            const d = new Date(t);
            if (isNaN(d.getTime())) return null;
            d.setHours(0, 0, 0, 0);
            return Math.ceil((d.getTime() - bugun.getTime()) / 86400000);
        };
        const devicesToScrapeFormat = instrumentsToNotify.map(inst => ({
            name: inst.name,
            serialNumber: inst.serialNumber || '',
            department: inst.department || '',
            location: inst.location || '',
            nextCalibrationDate: formatDateForDisplay(inst.nextCalibrationDate),
            lastCalibrationDate: formatDateForDisplay(inst.lastCalibrationDate),
            daysLeft: kalanGun(inst.nextCalibrationDate),   // Durum sutunu ve satir rengi
            status: inst.status,
        }));
        const subject = `Kalibrasyon Bildirimi - Filtrelenmiş Cihaz Listesi (${devicesToScrapeFormat.length} cihaz)`;
        return await handleSendImmediateReport(settings, devicesToScrapeFormat, subject);
    };

    const selectedInstrument = selectedInstrumentId ? instrumentsWithDetails.find(i => i.id === selectedInstrumentId) : null;

    const renderView = () => {
        switch (currentView) {
            case 'instrument_detail':
                return selectedInstrument && (
                    e(InstrumentDetailView, {
                        instrument: selectedInstrument,
                        records: calibrationRecords.filter(r => r.instrumentId === selectedInstrument.id),
                        onBack: handleBackToList,
                        onEditInstrument: handleEditInstrument,

                        onAddRecord: handleAddRecord,
                        onEditRecord: handleEditRecord,
                        onDeleteRecord: handleDeleteRecord
                    })
                );
            case 'all_calibrations':
                return e(AllCalibrationsView, { 
                            records: calibrationRecords, 
                            instruments: instruments, 
                            onEditRecord: handleEditRecord, 
                            onDeleteRecord: handleDeleteRecord,
                            onBulkDelete: handleBulkDeleteRecords,
                            onBulkEdit: (ids) => { setEditingRecordIdsForBulk(ids); setBulkRecordEditModalOpen(true); },
                            initialFilter: allCalibrationsInitialFilter
                        });
            case 'instruments':
                return e(InstrumentList, { 
                            instruments: instrumentsWithDetails, 
                            onAddInstrument: handleAddInstrument, 
                            onEditInstrument: handleEditInstrument, 
                            onDeleteInstrument: handleDeleteInstrument,
                            onShowDetail: handleShowInstrumentDetail,
                            onAddRecord: handleAddRecord,
                            onDataImport: () => setDataImportOpen(true),
                            onExport: handleInstrumentExportClick,
                            onBulkDelete: handleBulkDelete,
                            onBulkEdit: (ids) => { setEditingInstrumentIdsForBulk(ids); setBulkInstrumentEditModalOpen(true); },
                            onSendNotification: handleSendFilteredNotification,
                            initialFilter: instrumentListInitialFilter,
                            onNavigateToRecords: (instrumentId) => handleNavigation('all_calibrations', { searchTerm: instrumentId })
                        });
            case 'dashboard':
            default:
                return e(Dashboard, { 
                            instrumentsWithStatus: instrumentsWithDetails,
                            calibrationRecords: calibrationRecords, 
                            onNavigate: handleNavigation, 
                            onShowDetail: handleShowInstrumentDetail,
                            settings: settings
                        });
        }
    };
    
    return (
        e("div", { className: "min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans" },
            e(UpdateModal, { show: isUpdateAvailable, onUpdate: handleUpdate }),
            e(ToastContainer),
            e("header", { className: "bg-white dark:bg-slate-800 shadow-md p-4 flex justify-between items-center sticky top-0 z-40" },
                e("div", { className: "flex items-center gap-3" },
                    e(CompanyLogoIcon, { logo: settings.logo })
                ),
                 e("nav", { className: "flex items-center gap-2 md:gap-4" },
                    e("button", { onClick: () => handleNavigation('dashboard'), className: `px-3 py-2 text-sm md:text-base rounded-md font-semibold transition-colors ${currentView === 'dashboard' ? 'bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}` }, "Gösterge Paneli"),
                    e("button", { onClick: () => handleNavigation('instruments'), className: `px-3 py-2 text-sm md:text-base rounded-md font-semibold transition-colors ${currentView === 'instruments' ? 'bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}` }, "Cihazlar"),
                    e("button", { onClick: () => handleNavigation('all_calibrations'), className: `px-3 py-2 text-sm md:text-base rounded-md font-semibold transition-colors ${currentView === 'all_calibrations' ? 'bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}` }, "Tüm Kayıtlar"),
                    e("button", {
                        onClick: () => setCalendarOpen(true),
                        title: "Takvim",
                        className: `p-2 rounded-xl text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/20 hover:bg-sky-100 dark:hover:bg-sky-900/40 ring-1 ring-sky-200 dark:ring-sky-800 transition-all shadow-sm`
                    }, e(CalendarDaysIcon, {className: "w-5 h-5"}) ),
                    e("button", { onClick: () => setSettingsOpen(true), title: "Ayarlar", className: "p-2 rounded-xl text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 ring-1 ring-slate-200 dark:ring-slate-600 transition-all shadow-sm" },
                        e(WrenchScrewdriverIcon, { className: "w-5 h-5" })
                    )
                )
            ),
            e("main", { className: "p-4 md:p-6" },
                renderView()
            ),

            e(CalendarModal, {
                isOpen: isCalendarOpen,
                onClose: () => setCalendarOpen(false),
                instruments: instrumentsWithDetails,
                onNavigate: handleNavigation,
                onOpenInstrument: handleShowInstrumentDetail , onDayClick: () => { handleAddInstrument(); setCalendarOpen(false); }}),
            e(InstrumentForm, {
                isOpen: isInstrumentFormOpen,
                onClose: () => setInstrumentFormOpen(false),
                onSave: handleSaveInstrument,

                instruments: instruments,

            }),
            e(CalibrationForm, {
                isOpen: isCalibrationFormOpen,
                onClose: () => { setCalibrationFormOpen(false); setInstrumentIdForNewRecord(null); setEditingRecord(null); },
                onSave: handleSaveRecord,
                onUpdateRecord: (updated) => {
                    setCalibrationRecords(prev => prev.map(r => r.id === updated.id ? updated : r));
                    setEditingRecord(prev => prev && prev.id === updated.id ? updated : prev);
                },
                instrumentId: instrumentIdForNewRecord,
                instruments: instruments,
                record: editingRecord,
                calibrationRecords: calibrationRecords
            }),
             e(SettingsModal, {
                isOpen: isSettingsOpen,
                onClose: () => setSettingsOpen(false),
                settings: settings,
                onSave: setSettings,
                instruments: instruments,
                getInstrumentStatus: getInstrumentStatus
            }),
            e(DataImportModal, {
                isOpen: isDataImportOpen,
                onClose: () => setDataImportOpen(false),

            }),
            e(ExportModal, {

                onExport: handleExport,

                instruments: dataToExport
            }),
            e(BulkInstrumentEditModal, {
                isOpen: isBulkInstrumentEditModalOpen,
                onClose: () => setBulkInstrumentEditModalOpen(false),
                onSave: handleBulkInstrumentEditSave,

            }),
            e(BulkRecordEditModal, {

             e(ConfirmationModal, {

            })
        )
    );
};

const Dashboard = ({ instrumentsWithStatus: _tumCihazlar, calibrationRecords: _tumKayitlar, onNavigate, onShowDetail, settings }) => {
    // KONUM SUZGECI tek yerde: cihazlar konuma gore, kayitlar da o
    // cihazlarin kimliklerine gore suzuluyor. Asagidaki butun kartlar ve
    // grafikler bu ikisinden beslendigi icin hepsi birden takip ediyor.
    const [konum, setKonum] = useState('');
    const konumlar = useMemo(() => [...new Set(_tumCihazlar.map(i => i.location).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'tr')), [_tumCihazlar]);
    const instrumentsWithStatus = useMemo(
        () => konum ? _tumCihazlar.filter(i => i.location === konum) : _tumCihazlar,
        [_tumCihazlar, konum]);
    const _kimlikler = useMemo(() => new Set(instrumentsWithStatus.map(i => i.id)),
        [instrumentsWithStatus]);
    const calibrationRecords = useMemo(
        () => konum ? _tumKayitlar.filter(r => _kimlikler.has(r.instrumentId)) : _tumKayitlar,
        [_tumKayitlar, _kimlikler, konum]);
    const instrumentStats = useMemo(() => {
        const total = instrumentsWithStatus.length;
        const ok = instrumentsWithStatus.filter(i => i.status === CalibrationStatus.OK).length;
        const dueSoon = instrumentsWithStatus.filter(i => i.status === CalibrationStatus.DUE_SOON).length;
        const overdue = instrumentsWithStatus.filter(i => i.status === CalibrationStatus.OVERDUE).length;
        const pending = instrumentsWithStatus.filter(i => i.status === CalibrationStatus.PENDING).length;
        return { total, ok, dueSoon, overdue, pending };
    }, [instrumentsWithStatus]);

    const recordStats = useMemo(() => {
        const compliant = calibrationRecords.filter(r => r.result === CalibrationResult.COMPLIANT).length;
        const marginal = calibrationRecords.filter(r => r.result === CalibrationResult.MARGINAL).length;
        const nonCompliant = calibrationRecords.filter(r => r.result === CalibrationResult.NON_COMPLIANT).length;
        const total = calibrationRecords.length;
        return { compliant, marginal, nonCompliant, total };
    }, [calibrationRecords]);

    const recordTypeStats = useMemo(() => {
        const kalibrasyon = calibrationRecords.filter(r => r.recordType === RecordType.CALIBRATION).length;
        const dogrulama = calibrationRecords.filter(r => r.recordType === RecordType.VERIFICATION).length;
        const total = calibrationRecords.length;
        return { kalibrasyon, dogrulama, total };
    }, [calibrationRecords]);

    const attentionItems = useMemo(() => {
        return instrumentsWithStatus
            .filter(i => i.status === CalibrationStatus.OVERDUE || i.status === CalibrationStatus.DUE_SOON)
            .sort((a, b) => new Date(a.nextCalibrationDate).getTime() - new Date(b.nextCalibrationDate).getTime())
            .slice(0, 10);
    }, [instrumentsWithStatus]);

    const deviationItems = useMemo(() => {
        return instrumentsWithStatus
            .map(inst => {
                const rec = calibrationRecords
                    .filter(r => r.instrumentId === inst.id)
                    .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime())[0];
                if (!rec || (Number(rec.deviation) === 0 && Number(rec.uncertainty) === 0)) return null;
                return {
                    id: inst.id,
                    name: inst.name,
                    serialNumber: inst.serialNumber,
                    date: rec.date,
                    deviation: Number(rec.deviation) || 0,
                    uncertainty: Number(rec.uncertainty) || 0,
                    total: Math.abs(Number(rec.deviation) || 0) + (Number(rec.uncertainty) || 0),
                    permissibleDeviation: Number(inst.permissibleDeviation) || 0,
                    result: rec.result,
                    recordType: rec.recordType,
                };
            })
            .filter(item => item && item.result === CalibrationResult.NON_COMPLIANT)
            .sort((a, b) => b.total - a.total);
    }, [instrumentsWithStatus, calibrationRecords]);

    const instrumentChartRef = useRef(null);
    const instrumentChartInstanceRef = useRef(null);
    const recordChartRef = useRef(null);
    const recordChartInstanceRef = useRef(null);
    const recordTypeChartRef = useRef(null);
    const recordTypeChartInstanceRef = useRef(null);

    const createDoughnutChart = (canvasRef, chartInstanceRef, chartData, centerTextValue, centerTextLabel, onClickHandler) => {
        if (!canvasRef.current) return;
        if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
        }
        const ctx = canvasRef.current.getContext('2d');
        const centerTextPlugin = {
            id: 'centerText',
            afterDraw: (chart) => {
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                const { left, right, top, bottom } = chartArea;
                const centerX = (left + right) / 2;
                const centerY = (top + bottom) / 2 + 10;
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 36px Inter, sans-serif';
                ctx.fillStyle = document.body.classList.contains('dark') ? '#f1f5f9' : '#1e293b';
                ctx.fillText(centerTextValue, centerX, centerY - 15);
                ctx.font = 'normal 14px Inter, sans-serif';
                ctx.fillStyle = '#64748b';
                ctx.fillText(centerTextLabel, centerX, centerY + 15);
                ctx.restore();
            }
        };
        chartInstanceRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: true },
                    centerText: {}
                },
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const clickedIndex = elements[0].index;
                        const status = chartData.labels[clickedIndex];
                        onClickHandler(status);
                    }
                },
                onHover: (event, chartElement) => {
                    event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
                }
            },
            plugins: [centerTextPlugin]
        });
    };

    useEffect(() => {
        const instrumentChartData = {
            labels: [CalibrationStatus.OK, CalibrationStatus.DUE_SOON, CalibrationStatus.OVERDUE, CalibrationStatus.PENDING],
            datasets: [{
                data: [instrumentStats.ok, instrumentStats.dueSoon, instrumentStats.overdue, instrumentStats.pending],
                backgroundColor: ['#22c55e', '#f59e0b', '#ef4444', '#64748b'],
                borderColor: document.body.classList.contains('dark') ? '#1e293b' : '#ffffff',
                borderWidth: 4,
                hoverBorderColor: document.body.classList.contains('dark') ? '#334155' : '#f1f5f9',
            }]
        };
        createDoughnutChart(instrumentChartRef, instrumentChartInstanceRef, instrumentChartData, instrumentStats.total, 'Toplam Cihaz',
            (status) => onNavigate('instruments', { status: status })
        );
        return () => { if (instrumentChartInstanceRef.current) instrumentChartInstanceRef.current.destroy(); };
    }, [instrumentStats, onNavigate]);

    useEffect(() => {
        const recordChartData = {
            labels: [CalibrationResult.COMPLIANT, CalibrationResult.MARGINAL, CalibrationResult.NON_COMPLIANT],
            datasets: [{
                data: [recordStats.compliant, recordStats.marginal, recordStats.nonCompliant],
                backgroundColor: ['#22c55e', '#f59e0b', '#ef4444'],
                borderColor: document.body.classList.contains('dark') ? '#1e293b' : '#ffffff',
                borderWidth: 4,
                hoverBorderColor: document.body.classList.contains('dark') ? '#334155' : '#f1f5f9',
            }]
        };
        createDoughnutChart(recordChartRef, recordChartInstanceRef, recordChartData, recordStats.total, 'Toplam Kayıt',
            (result) => onNavigate('all_calibrations', { result: result })
        );
        return () => { if (recordChartInstanceRef.current) recordChartInstanceRef.current.destroy(); };
    }, [recordStats, onNavigate]);

    useEffect(() => {
        const recordTypeChartData = {
            labels: [RecordType.CALIBRATION, RecordType.VERIFICATION],
            datasets: [{
                data: [recordTypeStats.kalibrasyon, recordTypeStats.dogrulama],
                backgroundColor: ['#3b82f6', '#a855f7'],
                borderColor: document.body.classList.contains('dark') ? '#1e293b' : '#ffffff',
                borderWidth: 4,
                hoverBorderColor: document.body.classList.contains('dark') ? '#334155' : '#f1f5f9',
            }]
        };
        createDoughnutChart(recordTypeChartRef, recordTypeChartInstanceRef, recordTypeChartData, recordTypeStats.total, 'Toplam Kayıt',
            (type) => onNavigate('all_calibrations', { recordType: type })
        );
        return () => { if (recordTypeChartInstanceRef.current) recordTypeChartInstanceRef.current.destroy(); };
    }, [recordTypeStats, onNavigate]);

    return (
        e("div", { className: "space-y-6" },
            e("div", { className: "flex flex-wrap items-center justify-between gap-4" },
                e("h1", { className: "text-3xl font-bold text-slate-900 dark:text-slate-100" }, "Gösterge Paneli"),
                e("div", { className: "flex items-center gap-2 flex-wrap" },
                e("select", {
                    value: konum,
                    onChange: ev => setKonum(ev.target.value),
                    title: "Konuma göre süz — tüm kartlar ve grafikler bu seçime uyar",
                    className: "px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 dark:text-slate-200"
                },
                    e("option", { value: "" }, "📍 Tüm Konumlar"),
                    konumlar.map(l => e("option", { key: l, value: l }, l))
                ),
                e("button", {
                    onClick: () => {
                        const body = `Merhaba,\n\nKalibrasyonu gecikmiş veya yaklaşan cihazlar:\n${[...attentionItems].map(i => `- ${i.name} (SN: ${i.serialNumber}) - Sonraki Tarih: ${formatDateForDisplay(i.nextCalibrationDate)}`).join('\n')}`;
                        window.location.href = `mailto:${settings.notificationEmail || ''}?subject=Kalibrasyon Hatırlatması&body=${encodeURIComponent(body)}`;
                    },
                    className: "flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-sky-600 rounded-md hover:bg-sky-700 transition-colors",
                    title: "İlgi gerektiren cihazlar için bildirim maili oluşturur."
                },
                    e(EnvelopeIcon, {}),
                    "Bildirim Maili Gönder"
                )
                )
            ),
            e("div", { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" },
                e(StatCard, { onClick: () => onNavigate('instruments'), icon: e(DeviceTabletIcon, { className: "text-blue-600 dark:text-blue-400" }), title: "Toplam Cihaz", value: instrumentStats.total, color: "bg-blue-100 dark:bg-blue-900/50" }),
                e(StatCard, { onClick: () => onNavigate('instruments', { status: CalibrationStatus.OK }), icon: e(ShieldCheckIcon, { className: "text-green-600 dark:text-green-400" }), title: "Kalibrasyon Tamam", value: instrumentStats.ok, color: "bg-green-100 dark:bg-green-900/50" }),
                e(StatCard, { onClick: () => onNavigate('instruments', { status: CalibrationStatus.DUE_SOON }), icon: e(ClockIcon, { className: "text-yellow-600 dark:text-yellow-400" }), title: "Yaklaşan Kalibrasyon", value: instrumentStats.dueSoon, color: "bg-yellow-100 dark:bg-yellow-900/50" }),
                e(StatCard, { onClick: () => onNavigate('instruments', { status: CalibrationStatus.OVERDUE }), icon: e(ExclamationTriangleIcon, { className: "text-red-600 dark:text-red-400" }), title: "Gecikmiş Kalibrasyon", value: instrumentStats.overdue, color: "bg-red-100 dark:bg-red-900/50" })
            ),

            e("div", { className: "grid grid-cols-1 lg:grid-cols-3 gap-6" },
                e("div", { className: "bg-white dark:bg-slate-800 p-6 rounded-lg shadow-md" },
                    e("h2", { className: "text-xl font-semibold mb-4 text-center" }, "Cihaz Durum Dağılımı"),
                    e("div", { className: "relative h-64 md:h-80 mx-auto", style: { maxWidth: '320px' } },
                        e("canvas", { ref: instrumentChartRef })
                    ),
                    e("div", { className: "mt-6 grid grid-cols-2 gap-4 text-sm" },

const ViewSettingsModal = ({ isOpen, onClose, columns: initialColumns, onSave }) => {
    const [columns, setColumns] = useState(initialColumns);
    const [draggedIndex, setDraggedIndex] = useState(null);
    const selectAllCheckboxRef = useRef(null);

    useEffect(() => {
        setColumns(initialColumns);
    }, [initialColumns, isOpen]);
    
    useEffect(() => {
        if (selectAllCheckboxRef.current) {
            const allVisible = columns.every(c => c.visible);
            const someVisible = columns.some(c => c.visible);
            selectAllCheckboxRef.current.checked = allVisible;
            selectAllCheckboxRef.current.indeterminate = !allVisible && someVisible;
        }
    }, [columns]);

    const handleToggleVisibility = (key) => {
        setColumns(prev => prev.map(c => c.key === key ? { ...c, visible: !c.visible } : c));
    };
    
    const handleToggleSelectAll = (e) => {
        const isChecked = e.target.checked;
        setColumns(prev => prev.map(c => ({ ...c, visible: isChecked })));
    };
    
    const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
        if (e.currentTarget instanceof HTMLElement) {
             e.dataTransfer.setDragImage(e.currentTarget, 20, 20);
        }
    };
    
    const handleDragOver = (e, index) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === index) {
            return;
        }

        const newColumns = [...columns];
        const draggedItem = newColumns.splice(draggedIndex, 1)[0];
        newColumns.splice(index, 0, draggedItem);
        
        setDraggedIndex(index);
        setColumns(newColumns);
    };

    const handleDragEnd = () => {
        setDraggedIndex(null);
    };

    const handleSave = () => {
        onSave(columns);
        onClose();
    };

    return (
        e(Modal, { isOpen: isOpen, onClose: onClose, title: "Tablo Görünümünü Ayarla" },
            e("div", { className: "space-y-4" },
                e("p", { className: "text-sm text-slate-600 dark:text-slate-300" },
                    "Sütunları gösterin/gizleyin ve sürükleyerek yeniden sıralayın."
                ),
                e("div", { className: "pb-4 mb-4 border-b border-slate-200 dark:border-slate-700" },
                    e("label", { className: "flex items-center gap-3 p-2 cursor-pointer select-none bg-slate-100 dark:bg-slate-700 rounded-md" },
                        e("input", {
                            type: "checkbox",
                            ref: selectAllCheckboxRef,
                            onChange: handleToggleSelectAll,
                            className: "h-5 w-5 rounded border-slate-300 text-sky-600 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-900 dark:focus:ring-sky-600 dark:focus:ring-offset-slate-800"
                        }),
                        e("span", { className: "font-medium text-slate-800 dark:text-slate-200" }, "Tümünü Seç")
                    )
                ),
                e("ul", { className: "space-y-2" },
                    columns.map((col, index) => (
                        e("li", {
                            key: col.key,
                            className: `flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg transition-all duration-150 ease-in-out ${draggedIndex === index ? 'opacity-50 scale-105 shadow-lg' : 'shadow-sm hover:shadow-md'}`,
                            draggable: true,
                            onDragStart: (e) => handleDragStart(e, index),
                            onDragOver: (e) => handleDragOver(e, index),
                            onDragEnd: handleDragEnd
                        },
                            e("div", { className: "flex items-center gap-4" },
                                e("div", { className: "cursor-grab text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" },
                                   e(GripVerticalIcon, {})
                                ),
                                e("label", { className: "flex items-center gap-3 cursor-pointer select-none" },
                                    e("input", {
                                        type: "checkbox",
                                        className: "h-5 w-5 rounded border-slate-300 text-sky-600 focus:ring-sky-500 dark:border-slate-600 dark:bg-slate-900 dark:focus:ring-sky-600 dark:focus:ring-offset-slate-800",
                                        checked: col.visible,
                                        onChange: () => handleToggleVisibility(col.key)
                                    }),
                                    e("span", { className: "font-medium text-slate-800 dark:text-slate-200" }, col.label)
                                 )
                            )
                        )
                    ))
                ),
                 e("div", { className: "flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700" },
                    e("button", { type: "button", onClick: onClose, className: "px-4 py-2 rounded-md text-slate-700 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 font-semibold transition-colors" }, "İptal"),
                    e("button", { type: "button", onClick: handleSave, className: "px-4 py-2 rounded-md text-white bg-sky-600 hover:bg-sky-700 font-semibold transition-colors" }, "Kaydet")
