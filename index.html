const InstrumentList = ({ instruments, onAddInstrument, onEditInstrument, onDeleteInstrument, onShowDetail, onAddRecord, onDataImport, onExport, onBulkDelete, onBulkEdit, onSendNotification, onNavigateToRecords, initialFilter }) => {
    const [filters, setFilters] = useState({
        searchTerm: '',
        status: '',
        department: '',
        location: '',
        dateFilterType: 'none',
        startDate: '',
        endDate: '',
    });
    const [sortConfig, setSortConfig] = useState({ key: 'name', direction: 'ascending' });
    const [selectedIds, setSelectedIds] = useState([]);
    const [columns, setColumns] = useLocalStorage('instrumentTableColumns', ALL_INSTRUMENT_COLUMNS);
    const [isViewSettingsOpen, setViewSettingsOpen] = useState(false);

    useEffect(() => {
        const defaultFilters = {
            searchTerm: '', status: '', department: '', location: '',
            dateFilterType: 'none', startDate: '', endDate: ''
        };
        if (initialFilter) {
             setFilters({ ...defaultFilters, ...initialFilter });
        } else {
             setFilters(defaultFilters);
        }
    }, [initialFilter]);

    useEffect(() => {
        const allColumnKeys = new Set(ALL_INSTRUMENT_COLUMNS.map(col => col.key));
        const currentColumnKeys = new Set(columns.map(col => col.key));

        const newColumnsToAdd = ALL_INSTRUMENT_COLUMNS.filter(c => !currentColumnKeys.has(c.key));
        const validCurrentColumns = columns.filter(c => allColumnKeys.has(c.key));

        if (newColumnsToAdd.length > 0 || validCurrentColumns.length !== columns.length) {
            setColumns([...validCurrentColumns, ...newColumnsToAdd]);
        }
    }, []); 


    const visibleColumns = useMemo(() => columns.filter(c => c.visible), [columns]);

    const filteredInstruments = useMemo(() => {
        let filtered = instruments.filter(instrument => {
            const searchTermLower = filters.searchTerm.toLowerCase();
            return (
                (instrument.name.toLowerCase().includes(searchTermLower) ||
                 instrument.serialNumber.toLowerCase().includes(searchTermLower) ||
                 instrument.location.toLowerCase().includes(searchTermLower) ||
                 instrument.id.toLowerCase().includes(searchTermLower)) &&
                (filters.status === '' || instrument.status === filters.status) &&
                (filters.department === '' || instrument.department === filters.department) &&
                (filters.location === '' || instrument.location === filters.location)
            );
        });

        if (filters.dateFilterType !== 'none') {
            const { dateFilterType, startDate, endDate } = filters;
            
            filtered = filtered.filter(inst => {
                const dateValue = dateFilterType === 'lastCalibrationDate' ? inst.lastCalibrationDate : inst.nextCalibrationDate;
                if (!dateValue || dateValue === 'N/A') return false;
    
                const instDate = new Date(dateValue);
                instDate.setHours(0, 0, 0, 0); 
    
                if (startDate) {
                    const start = new Date(startDate);
                    start.setHours(0, 0, 0, 0);
                    if (instDate < start) return false;
                }
                if (endDate) {
                    const end = new Date(endDate);
                    end.setHours(23, 59, 59, 999);
                    if (instDate > end) return false;
                }
                return true;
            });
        }

        if (sortConfig !== null) {
            filtered.sort((a, b) => {
                const valA = a[sortConfig.key];
                const valB = b[sortConfig.key];

                if (valA == null && valB == null) return 0;
                if (valA == null) return 1;
                if (valB == null) return -1;
                
                if (sortConfig.key === 'name') {
                    return sortConfig.direction === 'ascending'
                        ? valA.localeCompare(valB, 'tr', { numeric: true })
                        : valB.localeCompare(valA, 'tr', { numeric: true });
                }

                if (sortConfig.key === 'lastCalibrationDate' || sortConfig.key === 'nextCalibrationDate') {
                    const dateA = new Date(valA).getTime();
                    const dateB = new Date(valB).getTime();
                     if (isNaN(dateA) && isNaN(dateB)) return 0;
                     if (isNaN(dateA)) return 1;
                     if (isNaN(dateB)) return -1;
                    return sortConfig.direction === 'ascending' ? dateA - dateB : dateB - dateA;
                }

                if (valA < valB) {
                    return sortConfig.direction === 'ascending' ? -1 : 1;
                }
                if (valA > valB) {
                    return sortConfig.direction === 'ascending' ? 1 : -1;
                }
                return 0;
            });
        }

        return filtered;
    }, [instruments, filters, sortConfig]);

    const criticalFilteredInstruments = useMemo(() => {
        return filteredInstruments.filter(instrument =>
            instrument.status === CalibrationStatus.OVERDUE || instrument.status === CalibrationStatus.DUE_SOON
        );
    }, [filteredInstruments]);

    const requestSort = (key) => {
        let direction = 'ascending';
        if (sortConfig && sortConfig.key === key && sortConfig.direction === 'ascending') {
            direction = 'descending';
        }
        setSortConfig({ key, direction });
    };

    const handleSelectAll = (e) => {
        if (e.target.checked) {
            setSelectedIds(filteredInstruments.map(i => i.id));
        } else {
            setSelectedIds([]);
        }
    };
    
    const handleSelectOne = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
    };
    
    const handleFilterChange = (e) => {
        const { name, value } = e.target;
        setFilters(prev => ({...prev, [name]: value}));
    };

    const handleSendNotificationClick = async () => {
        toastService.info('E-posta gönderiliyor, lütfen bekleyin...');

        if (result.type === 'success') {
            toastService.success(result.message);
        } else if (result.type === 'error') {
            toastService.error(result.message);
        } else {
            toastService.info(result.message);
        }
    };
    
    const departments = useMemo(() => [...new Set(instruments.map(i => i.department).filter((d) => Boolean(d)))], [instruments]);
    // Konum listesi sabit degil: cihazlarda gecen konumlardan turetilir,
    // yeni konum eklenince filtreye kendiliginden girer.
    const locations = useMemo(() => [...new Set(instruments.map(i => i.location).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'tr')), [instruments]);

    const counts = useMemo(() => ({
        overdue: instruments.filter(i => i.status === CalibrationStatus.OVERDUE).length,
        dueSoon: instruments.filter(i => i.status === CalibrationStatus.DUE_SOON).length,
    }), [instruments]);

    return (
        e("div", {},
            e("div", { className: "flex flex-wrap items-center justify-between gap-4 mb-6" },
                e("h1", { className: "text-3xl font-bold text-slate-900 dark:text-slate-100" }, "Cihazlar"),
                e("div", { className: "flex items-center gap-2 flex-wrap" },
                    e("button", { onClick: () => setViewSettingsOpen(true), className: "flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-700 bg-white dark:bg-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 rounded-md hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors" },
                        e(EyeIcon, {}), " Görünüm"
                    ),
                    e("button", { onClick: onDataImport, className: "flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-700 bg-white dark:bg-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 rounded-md hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors" },
                        e(DocumentArrowUpIcon, {}), " İçe Aktar"
                    ),
                    e("button", { onClick: () => onExport(filteredInstruments), className: "flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-700 bg-white dark:bg-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 rounded-md hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors" },
                       e(DocumentArrowDownIcon, {}), " Dışa Aktar"
                    ),
                     e("button", {
                        onClick: handleSendNotificationClick,
                        disabled: criticalFilteredInstruments.length === 0,
                        className: "flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-green-600 rounded-md hover:bg-green-700 transition-colors disabled:bg-slate-400 disabled:cursor-not-allowed"
                    },
                         e(EnvelopeIcon, {}),

        .filter(function (p) { return !isNaN(p.measured) && !isNaN(p.actual); });
    if (pts.length < 2 || isNaN(x)) return null;
    var target = corr.mode !== 'read';
    var pairs = pts.map(function (p) { return target ? { a: p.actual, b: p.measured } : { a: p.measured, b: p.actual }; })
        .sort(function (u, v) { return u.a - v.a; });
    var lo = pairs[0].a, hi = pairs[pairs.length - 1].a;
    var y = corrPiecewise(pairs, x);
    return { y: y, diff: y - x, pct: x !== 0 ? ((y - x) / x) * 100 : 0, ext: x < lo - 1e-9 || x > hi + 1e-9 };
}
function corrFmt(n, dec) { if (n === null || n === undefined || isNaN(n)) return '—'; return Number(n).toFixed(dec); }
function corrHasData(c) {
    return c && c.enabled && (c.points || []).filter(function (p) { return p && p.measured !== '' && p.measured != null && p.actual !== '' && p.actual != null; }).length >= 2;
}
function printCorrectionTable(record, instrument) {

    var dec = corrDecimals(corr.points || []);
    var unit = corr.unit || (instrument && instrument.unit) || '';
    var target = corr.mode !== 'read';
    var name = instrument ? instrument.name : (record.instrumentName || '');
    var serial = instrument ? (instrument.serialNumber || '') : '';
    var colX = target ? ('Gerçek Değer (' + unit + ')') : ('Ekran Göstergesi / Okunan (' + unit + ')');
    var colY = target ? ('Ekranda Görünmesi Gereken (' + unit + ')') : ('Gerçek Değer (' + unit + ')');
    var colD = target ? 'Fark (Ekran − Gerçek)' : 'Düzeltme (Gerçek − Okunan)';
    var rowsHtml = gen.rows.map(function (r) {
        return '<tr><td class="x">' + corrFmt(r.x, dec) + (r.ext ? ' <span class="ext">ext</span>' : '') + '</td><td class="y">' + corrFmt(r.y, dec) + '</td><td>' + (r.diff >= 0 ? '+' : '') + corrFmt(r.diff, dec) + '</td><td>' + (r.pct >= 0 ? '+' : '') + r.pct.toFixed(2) + ' %</td></tr>';
    }).join('');
    var ptsHtml = (corr.points || []).filter(function (p) { return p.measured !== '' && p.actual !== ''; }).map(function (p) { return '<tr><td>' + p.measured + '</td><td>' + p.actual + '</td></tr>'; }).join('');
    var usage = target ? 'Parçanın gerçek değeri «Gerçek Değer» sütunundaki kadarsa, makine ekranında «Ekranda Görünmesi Gereken» değeri görünür. Ekran okuması bu bandın içindeyse parça uygundur.' : 'Makine ekranında «Okunan» değeri gördüğünüzde, gerçek değer «Gerçek Değer» sütunundadır.';
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var noteHtml = (corr.note && String(corr.note).trim()) ? '<div class="usernote"><b>Açıklama:</b> ' + esc(corr.note).replace(/\n/g, '<br>') + '</div>' : '';
    var doc = '<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>' + name + ' — Düzeltme Tablosu</title>' +
        '<style>body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px;}h1{font-size:18px;margin:0 0 4px;}.sub{font-size:12px;color:#555;margin:0 0 2px;}table{border-collapse:collapse;width:100%;margin-top:14px;font-size:12px;}th,td{border:1px solid #999;padding:5px 8px;text-align:right;}th{background:#f0f0f0;font-size:11px;}td.x{font-weight:bold;text-align:left;}td.y{font-weight:bold;color:#0369a1;}.ext{font-size:9px;background:#fde68a;color:#92400e;padding:0 3px;border-radius:3px;}.usage{margin-top:12px;font-size:12px;padding:8px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:4px;}.usernote{margin-top:10px;font-size:13px;padding:9px 11px;background:#fffbeb;border:1px solid #fde68a;border-radius:4px;white-space:normal;}.pts{margin-top:14px;width:auto;}.pts th,.pts td{padding:3px 10px;}.note{margin-top:12px;font-size:10px;color:#777;}@media print{button{display:none;}}</style></head><body>' +
        '<h1>' + name + ' — Düzeltme / Sapma Tablosu</h1>' +
        '<p class="sub">Cihaz: ' + esc(name) + (instrument && instrument.id ? ' (' + esc(instrument.id) + ')' : '') + '</p>' +
        '<p class="sub">Seri No: ' + serial + ' &nbsp;·&nbsp; Rapor No: ' + (record.reportNumber || '—') + ' &nbsp;·&nbsp; Kalibrasyon: ' + formatDateForDisplay(record.date) + '</p>' +
        '<p class="sub">Birim: ' + unit + ' &nbsp;·&nbsp; Aralık: ' + corr.rangeMin + ' – ' + corr.rangeMax + ' ' + unit + ' (adım ' + corr.rangeStep + ')</p>' +
        '<div class="usage">' + usage + '</div>' +
        noteHtml +
        '<table><thead><tr><th style="text-align:left">' + colX + '</th><th>' + colY + '</th><th>' + colD + '</th><th>Sapma %</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>' +

    var w = window.open('', '_blank');
    if (!w) { try { toastService.error('Açılır pencere engellendi. Pop-up izni verin.'); } catch (_) { } return; }
    w.document.open(); w.document.write(doc); w.document.close();
}

const AllCalibrationsView = ({ records, instruments, onEditRecord, onDeleteRecord, onBulkDelete, onBulkEdit, initialFilter }) => {
    const openReport = (reportFile) => {
        if (!reportFile) return;
        if (reportFile.previewUrl) { window.open(reportFile.previewUrl, '_blank'); return; }
        if (reportFile.driveUrl) { window.open(reportFile.driveUrl, '_blank'); return; }
        if (reportFile.data) {
            const link = document.createElement('a');
            link.href = reportFile.data; link.download = reportFile.name || 'rapor.pdf';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            return;
        }
        toastService.error('Rapor dosyası bulunamadı.');
    };
    const [filters, setFilters] = useState({ searchTerm: '', result: '', recordType: '', location: '' });
    const [columns, setColumns] = useLocalStorage('allCalibrationsTableColumns', ALL_CALIBRATIONS_COLUMNS);
    const [isViewSettingsOpen, setViewSettingsOpen] = useState(false);
    const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'descending' });
    const [selectedIds, setSelectedIds] = useState([]);
    const [correctionModalRecord, setCorrectionModalRecord] = useState(null);

    useEffect(() => {
        setFilters({
            searchTerm: initialFilter?.searchTerm || '',
            result: initialFilter?.result || '',
            recordType: initialFilter?.recordType || '',
            location: initialFilter?.location || ''
        });
    }, [initialFilter]);

    useEffect(() => {
        const allColumnKeys = new Set(ALL_CALIBRATIONS_COLUMNS.map(col => col.key));
        const currentColumnKeys = new Set(columns.map(col => col.key));
        const newColumnsToAdd = ALL_CALIBRATIONS_COLUMNS.filter(c => !currentColumnKeys.has(c.key));
        const validCurrentColumns = columns.filter(c => allColumnKeys.has(c.key));
        if (newColumnsToAdd.length > 0 || validCurrentColumns.length !== columns.length) {
            setColumns([...validCurrentColumns, ...newColumnsToAdd]);
        }
    }, []);

    const visibleColumns = useMemo(() => columns.filter(c => c.visible), [columns]);

    const filteredRecords = useMemo(() => {
        const recordsWithDetails = records.map(record => {
            const instrument = instruments.find(i => i.id === record.instrumentId) || { name: 'Bilinmeyen Cihaz', serialNumber: 'N/A', location: '' };
            const refInstrument = record.referenceInstrumentId ? instruments.find(i => i.id === record.referenceInstrumentId) : null;
            
            const deviation = Number(record.deviation) || 0;
            const uncertainty = Number(record.uncertainty) || 0;
            const effectiveDeviation = calculateEffectiveDeviation(deviation, uncertainty);
            const totalDeviationForDisplay = effectiveDeviation * (deviation < 0 ? -1 : 1);

            return {
                ...record,
                instrumentName: instrument.name,
                instrumentSerial: instrument.serialNumber,
                instrumentLocation: instrument.location || '',
                referenceInstrumentName: refInstrument ? `${refInstrument.name} (SN: ${refInstrument.serialNumber})` : (record.referenceInstrumentId || ''),
                totalDeviation: totalDeviationForDisplay,
            };
        });

        const term = filters.searchTerm.toLowerCase();
        let filtered = recordsWithDetails;

        if (term) {
            filtered = filtered.filter(r => 
                r.instrumentName.toLowerCase().includes(term) ||
                r.instrumentSerial.toLowerCase().includes(term) ||
                r.instrumentId.toLowerCase().includes(term) ||
                r.technician.toLowerCase().includes(term) ||
                r.calibratingCompany.toLowerCase().includes(term) ||
                (r.reportNumber && r.reportNumber.toLowerCase().includes(term)) ||
                (r.assignedPersonnel && r.assignedPersonnel.toLowerCase().includes(term)) ||
                (r.referenceInstrumentName && r.referenceInstrumentName.toLowerCase().includes(term))
            );
        }
        
        if (filters.result) {
            filtered = filtered.filter(r => r.result === filters.result);
        }

        if (filters.recordType) {
            filtered = filtered.filter(r => r.recordType === filters.recordType);
        }

        // Kaydin konumu yok; bagli oldugu CIHAZIN konumuna gore suzulur.
        if (filters.location) {
            filtered = filtered.filter(r => r.instrumentLocation === filters.location);
        }

        if (sortConfig !== null) {
            filtered.sort((a, b) => {
                const key = sortConfig.key;
                const valA = a[key];
                const valB = b[key];

                if (key === 'date') {
                    const dateA = new Date(valA).getTime();
                    const dateB = new Date(valB).getTime();
                    if (dateA < dateB) return sortConfig.direction === 'ascending' ? -1 : 1;
                    if (dateA > dateB) return sortConfig.direction === 'ascending' ? 1 : -1;
                    return 0;
                }
        
                if (valA == null && valB == null) return 0;
                if (valA == null) return 1;
                if (valB == null) return -1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    if (valA < valB) return sortConfig.direction === 'ascending' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'ascending' ? 1 : -1;
                    return 0;
                }
        
                if (typeof valA === 'string' && typeof valB === 'string') {
                    return sortConfig.direction === 'ascending'
                        ? valA.localeCompare(valB, 'tr')
                        : valB.localeCompare(valA, 'tr');
                }
        
                return 0;
            });
        }

        return filtered;
    }, [records, instruments, filters, sortConfig]);

const CalibrationForm = ({ isOpen, onClose, onSave, onUpdateRecord, instrumentId, instruments, record, calibrationRecords }) => {
    const instrument = useMemo(() => {
        return instrumentId ? instruments.find(i => i.id === instrumentId) : null;
    }, [instrumentId, instruments]);
    
    const defaultFormState = {
        date: dateKeyOf(new Date()),
        technician: '', calibratingCompany: '', reportNumber: '', deviation: 0, uncertainty: 0,
        notes: '', recordType: RecordType.CALIBRATION,
        referenceInstrumentId: '', assignedPersonnel: '', reportFile: null,
        corrections: null, uncertaintyIsManual: false
    };

    const [formData, setFormData] = useState(defaultFormState);
    const [autoUncertaintyInfo, setAutoUncertaintyInfo] = useState(null);
    const [showRemoveDialog, setShowRemoveDialog] = useState(false);
    const fileInputRef = useRef(null);
    
    const referenceInstruments = useMemo(() => {
        if (!instrument) return [];
        const today = new Date();
        return instruments.filter(i => {
            if (i.id === instrument.id || !i.lastCalibrationDate) return false;
            const nextDate = calculateNextCalibrationDate(i.lastCalibrationDate, i.calibrationInterval);
            return nextDate && nextDate > today;
        });
    }, [instruments, instrument]);
    
    useEffect(() => {
        if (record) {
            setFormData({ ...defaultFormState, ...record });
        } else {
            setFormData(defaultFormState);
        }
    }, [record, isOpen]);

    useEffect(() => {
        if (formData.recordType === RecordType.VERIFICATION && formData.referenceInstrumentId) {
            const referenceInstrument = instruments.find(i => i.id === formData.referenceInstrumentId);
            const refInstrumentRecords = calibrationRecords
                .filter(r => r.instrumentId === formData.referenceInstrumentId && r.recordType === RecordType.CALIBRATION)
                .sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

            const lastRefUncertainty = refInstrumentRecords[0]?.uncertainty;
            const currentInstrumentResolutionStr = instrument?.resolution || '';
            const resolutionValue = parseFloat(currentInstrumentResolutionStr.replace(/[^0-9.]/g, ''));

            if (referenceInstrument && typeof lastRefUncertainty === 'number' && !isNaN(resolutionValue) && resolutionValue > 0) {
                const resolutionUncertaintyComponent = resolutionValue / Math.sqrt(3);
                const totalUncertainty = Math.sqrt(
                    Math.pow(lastRefUncertainty, 2) +
                    Math.pow(resolutionUncertaintyComponent, 2)
                );
                const roundedUncertainty = parseFloat(totalUncertainty.toPrecision(4));

                if (!formData.uncertaintyIsManual) {
                    setFormData(prev => ({ ...prev, uncertainty: roundedUncertainty, uncertaintyIsManual: false }));
                    setAutoUncertaintyInfo(`Oto. hesap: √(Ref. Belirsizlik² + (Çözünürlük / √3)²) = √(${lastRefUncertainty}² + (${resolutionValue.toPrecision(2)} / √3)²) ≈ ${roundedUncertainty}`);
                } else {
                    setAutoUncertaintyInfo(`Manuel giriş aktif. Oto. değer ≈ ${roundedUncertainty} — otomatike dönmek için temizle`);
                }
            } else {
                setAutoUncertaintyInfo('Otomatik hesaplama için referans cihazın belirsizliği veya bu cihazın çözünürlüğü bulunamadı.');
            }
        } else {
            setAutoUncertaintyInfo(null);
        }
    }, [formData.recordType, formData.referenceInstrumentId, formData.uncertaintyIsManual, instrument, instruments, calibrationRecords]);
    
    const derivedValues = useMemo(() => {
        if (!instrument) return { effectiveDeviation: null, result: null, displayedTotalDeviation: null };
        const deviation = Number(formData.deviation) || 0;
        const uncertainty = Number(formData.uncertainty) || 0;
        
        // For compliance check, we use the absolute value
        const effectiveDeviation = calculateEffectiveDeviation(deviation, uncertainty);
        const result = getCalibrationResult(effectiveDeviation, instrument.permissibleDeviation);
        
        // For display, we preserve the sign of the deviation
        const displayedTotalDeviation = effectiveDeviation * (deviation < 0 ? -1 : 1);

        return { effectiveDeviation, result, displayedTotalDeviation };
    }, [formData.deviation, formData.uncertainty, instrument]);

    if (!instrument) return null;

    const handleChange = (e) => {
        const { name, value, type } = e.target;
        const isNumeric = type === 'number';
        setFormData(prev => ({ ...prev, [name]: isNumeric ? parseFloat(value) || 0 : value }));
    };

    const handleFileChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const gasUrl = _gasUrl || (() => { try { return JSON.parse(localStorage.getItem('settings') || '{}').serviceUrl || ''; } catch(_) { return ''; } })();
        if (gasUrl) {
            toastService.info('PDF Google Drive\'a yükleniyor...');
            try {
                const subfolder = instrument ? instrument.name : '';
                const result = await uploadToDrive(file, subfolder);
                setFormData(prev => ({
                    ...prev,
                    reportFile: { name: file.name, driveFileId: result.fileId, driveUrl: result.driveUrl, previewUrl: result.previewUrl }
                }));
                toastService.success('PDF Drive\'a yüklendi ✓');
            } catch (err) {
                toastService.error('Drive hatası: ' + err.message);
            }
        } else if (file.size <= 300 * 1024) {
            const base64 = await fileToBase64(file);
            setFormData(prev => ({
                ...prev,
                reportFile: { name: file.name, type: file.type, data: base64 }
            }));
        } else {
            toastService.error(`PDF çok büyük (${(file.size/1024).toFixed(0)}KB). Drive için Ayarlar → Servis URL girin.`);
            if (e.target) e.target.value = '';
            return;
        }
        if (e.target) e.target.value = '';
    };

    const handleFileRemove = () => {
        const rf = formData.reportFile;
        // Drive dosyası varsa 3 seçenekli diyalog aç; yoksa direkt kaldır
        if (rf && rf.driveFileId) {
            setShowRemoveDialog(true);
        } else {
            doRemoveLink();
        }
    };

    // Mevcut kayıttan raporu anında kalıcı kaldır (Kaydet beklemeden)
    const persistRemoval = () => {
        if (record && onUpdateRecord) {
            onUpdateRecord({ ...formData, reportFile: null, id: record.id, instrumentId: instrument.id, result: derivedValues.result || record.result });
        }
    };

    const doRemoveLink = () => {
        setFormData(prev => ({...prev, reportFile: null}));
        if (fileInputRef.current) fileInputRef.current.value = "";
        setShowRemoveDialog(false);
        persistRemoval();
    };

    const doDeleteFromDrive = async () => {
        const rf = formData.reportFile;
        setShowRemoveDialog(false);
        if (rf && rf.driveFileId) {
            try {
                const res = await deleteFromDrive(rf.driveFileId);
                if (res.success) toastService.success("Rapor Drive'dan silindi ✓");
                else toastService.error("Drive silme hatası: " + (res.error || 'bilinmiyor'));
            } catch (err) {
                toastService.error("Drive silme hatası: " + err.message);
            }
        }
        setFormData(prev => ({...prev, reportFile: null}));
        if (fileInputRef.current) fileInputRef.current.value = "";
        persistRemoval();
    };
    
    const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
            ...formData,
            id: record ? record.id : Date.now().toString(),
            instrumentId: instrument.id,
            result: derivedValues.result || CalibrationResult.COMPLIANT,
        });
    };

    const nextCalibrationDate = instrument.lastCalibrationDate 
        ? formatDateForDisplay(calculateNextCalibrationDate(instrument.lastCalibrationDate, instrument.calibrationInterval)?.toISOString())
        : "Hesaplanmadı";

    return (

const DataImportModal = ({ isOpen, onClose, onImport }) => {
    const [file, setFile] = useState(null);
    const [error, setError] = useState('');
    const [isLoading, setIsLoading] = useState(false);
    const [mode, setMode] = useState('standard');
    const fileInputRef = useRef(null);
    const fileInputRefSM = useRef(null);

    const handleFileChange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
            setFile(e.target.files[0]);
        } else {
            setFile(null);
        }
        setError('');
    };

    const resetState = () => {
        setFile(null);
        setError('');
        setIsLoading(false);
        if (fileInputRef.current) fileInputRef.current.value = "";
        if (fileInputRefSM.current) fileInputRefSM.current.value = "";
    };

    const handleClose = () => {
        resetState();
        onClose();
    };

    const handleModeChange = (newMode) => { setMode(newMode); resetState(); };

    const handleImport = () => {
        if (!file) {
            setError('Lütfen bir Excel dosyası seçin.');
            return;
        }
        setIsLoading(true);
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                if (data.length < 2) {
                    throw new Error(`Excel dosyası boş veya sadece başlık satırı içeriyor.`);
                }
                onImport(data);
                handleClose();

            } catch (e) {
                setError(`Dosya okunurken hata: ${e.message}`);
            } finally {
                setIsLoading(false);
            }
        };
        reader.onerror = () => {
            setError('Dosya okunamadı.');
            setIsLoading(false);
        };
        reader.readAsBinaryString(file);
    };

    const handleSMImport = () => {
        if (!file) { setError('Lütfen Şerit Metre zimmet listesi Excel dosyasını seçin.'); return; }
        setIsLoading(true);
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
                const wsName = wb.SheetNames.find(n => /sayfa2/i.test(n)) || wb.SheetNames[wb.SheetNames.length - 1];
                const ws = wb.Sheets[wsName];
                const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, dateNF: 'yyyy-mm-dd' });
                let headerIdx = 4;
                for (let i = 0; i < Math.min(raw.length, 10); i++) {
                    const r = raw[i] || [];
                    if (r.some(c => c && String(c).toUpperCase().includes('DOĞRULAMA'))) { headerIdx = i; break; }
                }
                const dataRows = raw.slice(headerIdx + 1).filter(r => r && r[1] != null && String(r[1]).trim() !== '');
                if (dataRows.length === 0) throw new Error("Sayfa2'de geçerli veri satırı bulunamadı.");
                const stdHeaders = [
                    'Cihaz ID', 'Cihaz Adı', 'Seri No', 'Model', 'Konum', 'Departman',
                    'Kal. Aralığı (Ay)', 'İzin Verilen Sapma', 'Birim', 'Ölçüm Aralığı', 'Çözünürlük', 'Procedür',
                    'Son Kalibrasyon Tarihi', 'Kayıt Tipi', 'Tarih', 'Teknisyen', 'Firma', 'Rapor No',
                    'Sapma', 'Belirsizlik', 'Notlar', 'Zimmetli Personel', 'Referans Cihaz Seri No'
                ];
                const rows = [stdHeaders];
                dataRows.forEach(r => {
                    const no = parseInt(String(r[1] || '').trim(), 10);
                    if (isNaN(no)) return;
                    const id = 'SM-' + String(no).padStart(3, '0');
                    const sorumlu = String(r[2] || '').trim();
                    const bolum = String(r[4] || '').trim();
                    const dogTarih = r[5] ? String(r[5]).trim() : '';
                    const kullanim = String(r[3] || '').trim();
                    rows.push([
                        id, 'Şerit Metre', id, '', bolum, bolum,
                        6, 1, 'mm', '0-5000 mm', '1 mm', '',
                        dogTarih, 'Doğrulama', dogTarih, sorumlu, '', '',
                        0, 0, kullanim, sorumlu, ''
                    ]);
                });
                if (rows.length < 2) throw new Error('İşlenecek geçerli satır bulunamadı.');
                onImport(rows);
                handleClose();
            } catch (e) {
                setError(`Dosya okunurken hata: ${e.message}`);
            } finally {
                setIsLoading(false);
            }
        };
        reader.onerror = () => { setError('Dosya okunamadı.'); setIsLoading(false); };
        reader.readAsBinaryString(file);
    };

    const handleDownloadTemplate = () => {
        const headers = [
            'Cihaz ID', 'Cihaz Adı', 'Seri No', 'Model', 'Konum', 'Departman', 'Kal. Aralığı (Ay)', 'İzin Verilen Sapma', 'Birim', 'Ölçüm Aralığı', 'Çözünürlük', 'Prosedür', 'Son Kalibrasyon Tarihi',
            'Kayıt Tipi', 'Tarih', 'Teknisyen', 'Firma', 'Rapor No', 'Sapma', 'Belirsizlik', 'Notlar', 'Zimmetli Personel', 'Referans Cihaz Seri No'
        ];
        const exampleRow = [
            'TK-015', 'Dijital Kumpas', 'SN-00123', 'Mitutoyo 500-196-30', 'Kalite Kontrol Lab.', 'Kalite', 12, 0.02, 'mm', '0-150mm', '0.01mm', '1. Cihazı temizle...', '20.05.2023',
            'Kalibrasyon', '20.05.2024', 'Ahmet Yılmaz', 'Kalibrasyon A.Ş.', 'RP-2024-987', 0.01, 0.005, 'Yıllık planlı kalibrasyon yapıldı.', '', ''
        ];

        const ws = XLSX.utils.aoa_to_sheet([headers, exampleRow]);
        const colWidths = headers.map((header, i) => ({ wch: Math.max(header.length, String(exampleRow[i] || '').length, 15) + 2 }));
        ws['!cols'] = colWidths;

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Şablon');
        XLSX.writeFile(wb, 'Kalibrasyon_İçe_Aktarma_Şablonu.xlsx');
    };

    const tabCls = (m) => m === mode
        ? "px-4 py-2 text-sm font-semibold rounded-t-md border-b-2 border-sky-600 text-sky-700 dark:text-sky-300 bg-sky-50 dark:bg-sky-900/30"
        : "px-4 py-2 text-sm font-semibold rounded-t-md border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700/50";

    return (
        e(Modal, { isOpen: isOpen, onClose: handleClose, title: "Veri İçe Aktar (Cihaz + Kayıt)" },
            e("div", { className: "space-y-4" },
                e("div", { className: "flex gap-1 border-b border-slate-200 dark:border-slate-700 -mx-1" },
                    e("button", { type: "button", onClick: () => handleModeChange('standard'), className: tabCls('standard') }, "Standart Excel"),
                    e("button", { type: "button", onClick: () => handleModeChange('sritMetre'), className: tabCls('sritMetre') }, "Şerit Metre Listesi")
                ),

                mode === 'standard' && e(React.Fragment, null,
                    e("p", { className: "text-sm text-slate-600 dark:text-slate-300" },
                        "Toplu olarak yeni cihazlar ve kalibrasyon kayıtları eklemek için bir Excel (.xlsx) dosyası yükleyin. Sistem, Seri Numarasına göre bir cihazın var olup olmadığını kontrol eder. Cihaz yoksa oluşturur; varsa, yeni kaydı mevcut cihaza ekler. Başlamadan önce şablonu indirip doldurabilirsiniz. Cihaz resimleri bu yöntemle içe aktarılamaz."
                    ),
                    e("button", { onClick: handleDownloadTemplate, className: "inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-green-700 bg-green-100 dark:bg-green-900/50 dark:text-green-300 rounded-md hover:bg-green-200 dark:hover:bg-green-800 transition-colors" },
                        e(DocumentArrowDownIcon, {}), " Şablon İndir"
                    ),
                    e("div", { className: "pt-2" },
                        e(FormInput, {
                            ref: fileInputRef,
                            id: "excel-file-import",
                            type: "file",
                            label: "Excel Dosyası (.xlsx)",
                            accept: ".xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",

                    e("div", { className: "rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700 p-3 text-sm text-amber-800 dark:text-amber-200 space-y-1" },
                        e("p", { className: "font-semibold" }, "Şerit Metre Zimmet Takip Listesi"),

const SettingsModal = ({ isOpen, onClose, settings, onSave, instruments, getInstrumentStatus }) => {
    const [localSettings, setLocalSettings] = useState(settings);
    const [genaiApiKey, setGenaiApiKey] = useState('');
    const [log, setLog] = useState([]);
    const [status, setStatus] = useState({ text: 'Başlatılmadı.', color: 'text-slate-500' });
    const isSyncInFlight = useRef(false);
    const lastHash = useRef('');
    const debounceTimer = useRef(null);
    const prevConfigRef = useRef(null);

    useEffect(() => {
        setLocalSettings(settings);
        if (isOpen) {
            setGenaiApiKey(localStorage.getItem('GENAI_API_KEY') || '');
            setLog([]);
            setStatus({ text: 'Hazır.', color: 'text-slate-500' });
            lastHash.current = '';
            prevConfigRef.current = null; // Reset on open to handle change detection correctly
        }
    }, [settings, isOpen]);

    const addLog = (m) => {
        const timestamp = `[${new Date().toLocaleTimeString()}]`;
        setLog(prev => [`${timestamp} ${m}`, ...prev].slice(0, 100));
    };

    const updateStatus = (text, color = 'text-slate-800 dark:text-slate-200') => {
        setStatus({ text, color });
    };

    const handleSaveAndClose = () => {
        localStorage.setItem('GENAI_API_KEY', genaiApiKey);
        if (window.reinitializeGenAI) {
            window.reinitializeGenAI();
        }
        onSave(localSettings);
        onClose();
    };
    
    const criticalInstruments = useMemo(() => {
        return instruments
            .filter(inst => {
                const status = getInstrumentStatus(inst, localSettings.thresholdDays || 15);
                return status === CalibrationStatus.OVERDUE || status === CalibrationStatus.DUE_SOON;
            })
            .map(inst => {
                const status = getInstrumentStatus(inst, localSettings.thresholdDays || 15);
                 const nextCalibrationDate = inst.lastCalibrationDate
                    ? calculateNextCalibrationDate(inst.lastCalibrationDate, inst.calibrationInterval)
                    : null;
                return {
                    name: inst.name,
                    serial: inst.serialNumber,
                    status: status,
                    lastCalibration: inst.lastCalibrationDate || 'N/A',
                    nextCalibration: nextCalibrationDate ? dateKeyOf(nextCalibrationDate) : 'N/A',
                };
            });
    }, [instruments, getInstrumentStatus, localSettings.thresholdDays]);
    
    const hashDevices = (devs) => {
        try {
            let str = JSON.stringify(devs);
            let h = 5381;
            for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
            return (h >>> 0).toString(16);
        } catch(e) {
            return '';
        }
    };

    const criticalInstrumentsHash = useMemo(() => hashDevices(criticalInstruments), [criticalInstruments]);

    const handleSyncServerSnapshot = useCallback(async (reason, forceState) => {
        if (isSyncInFlight.current) return;
        const { serviceUrl: api, adminKey, toList, scheduleTime, thresholdDays: thr, scheduleEnabled } = localSettings;

        const isEnabled = forceState !== undefined ? forceState : scheduleEnabled;
        
        if (!api || !adminKey) {
            if (isEnabled) updateStatus("API URL ve Yönetici Anahtarı gerekli.", "text-red-500");
            return;
        }

        try {
            isSyncInFlight.current = true;
            updateStatus("Senkronlanıyor…", "text-sky-500");
            
            const [hourStr, minuteStr] = (scheduleTime || '09:00').split(':');
            let body = { adminKey, enabled: isEnabled };
            
            if (criticalInstrumentsHash === lastHash.current && !['manuel', 'toggle', 'periyodik', 'config_change'].includes(reason)) {
                 addLog("Değişiklik yok, senkron atlandı.");
                 if (status.text.startsWith("Hata")) {
                    updateStatus(`Senkron OK (cihaz: ${criticalInstruments.length})`, "text-green-500");
                 }
                 isSyncInFlight.current = false;
                 return;
            }

            if (isEnabled) {
                 if (!toList) {
                     updateStatus("Alıcı listesi gerekli.", "text-red-500");
                     throw new Error("Alıcı listesi boş.");
                 }
                 if (criticalInstruments.length === 0) {
                     addLog(`Senkron atlandı: Gönderilecek kritik cihaz yok.`);
                 }
                body = {
                    ...body,
                    toList: toList.split(",").map(s => s.trim()).filter(Boolean),
                    hour: parseInt(hourStr, 10) || 9,
                    minute: parseInt(minuteStr, 10) || 0,
                    thresholdDays: Number(thr),
                    mode: "snapshot",
                    snapshotDevices: criticalInstruments
                };
            }

            // Apps Script tabanlı cron kullanılıyor → sunucuya schedule KAYDI yapılmaz (no-op).
            // Otomatik mail, Apps Script'teki 'dailyCheck' zaman tetikleyicisi ile gönderilir.
            void body;
            
            if (isEnabled) {
                lastHash.current = criticalInstrumentsHash;
                updateStatus(`Senkron OK (cihaz: ${criticalInstruments.length})`, "text-green-500");
                addLog(`Senkron tamamlandı (${reason}). Cihaz: ${criticalInstruments.length}. Durum: Etkin.`);
                 if (reason === 'otomatik' || reason === 'periyodik' || reason === 'başlangıç' || reason === 'config_change') {
                    toastService.success("Otomatik e-posta için veriler başarıyla gönderildi.");
                }
            } else {
                lastHash.current = '';
                updateStatus(`Raporlama Devre Dışı Bırakıldı`, "text-yellow-600");
                addLog(`Senkron tamamlandı (${reason}). Durum: Devre Dışı.`);
            }
        } catch (e) {
            updateStatus(`Hata: ${e.message}`, "text-red-500");
            addLog(`HATA: ${e.message}`);
        } finally {
            isSyncInFlight.current = false;
        }
    }, [localSettings, criticalInstruments, criticalInstrumentsHash, status.text]);

    const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
         if (name === 'scheduleEnabled') {
            const isEnabled = checked;
            setLocalSettings(prev => ({ ...prev, scheduleEnabled: isEnabled }));
            handleSyncServerSnapshot('toggle', isEnabled);
            return;
        }
        setLocalSettings(prev => ({
            ...prev,
            [name]: type === 'checkbox' ? checked : type ==='number' ? parseInt(value, 10) : value
        }));
    };
    
    const handleLogoChange = async (e) => {
        const file = e.target.files?.[0];
        if (file) {
            const base64 = await fileToBase64(file);
            setLocalSettings(prev => ({ ...prev, logo: base64 }));
        }
    };
    
    const handleSendTestNow = async () => {
        const { serviceUrl: api, toList, thresholdDays: thr } = localSettings;
        try {
            if (criticalInstruments.length === 0) throw new Error("Gönderilecek cihaz yok.");
            updateStatus("Test maili gönderiliyor...", "text-sky-500");

            if (!api) throw new Error("Servis URL girilmedi.");
            await fetch(api, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    toList: toList.split(",").map(s => s.trim()).filter(Boolean),
                    subject: `Kalibrasyon — Geciken & ${thr} gün içinde Yaklaşıyor (Anlık Test)`,
                    thresholdDays: Number(thr),
                    devices: criticalInstruments
                })
            });
            updateStatus("Test maili gönderildi (Apps Script).", "text-green-500");
            addLog("Test maili gönderildi. Cihaz: " + criticalInstruments.length);
        } catch (e) {
            updateStatus(`Hata: ${e.message}`, "text-red-500");
            addLog(`HATA: ${e.message}`);
        }
    };
    
    useEffect(() => {
        // Apps Script cron kullanılıyor → periyodik sunucu-snapshot senkronu KAPALI (Failed to fetch döngüsü önlenir).
        if (debounceTimer.current) clearTimeout(debounceTimer.current);
        return;
        if (!isOpen || !localSettings.scheduleEnabled) {
            if (debounceTimer.current) clearTimeout(debounceTimer.current);
            prevConfigRef.current = null; // Reset when closed or disabled
            return;
        };
        
        if (prevConfigRef.current === null) {
            prevConfigRef.current = {
                time: localSettings.scheduleTime,
                threshold: localSettings.thresholdDays
            };
        }

        if (debounceTimer.current) clearTimeout(debounceTimer.current);
        
        debounceTimer.current = setTimeout(() => {
            if (isOpen && localSettings.scheduleEnabled) {
                const prevConfig = prevConfigRef.current || {};
                const configChanged =
                    prevConfig.time !== localSettings.scheduleTime ||
                    prevConfig.threshold !== localSettings.thresholdDays;
                
                const reason = configChanged ? 'config_change' : 'otomatik';
                handleSyncServerSnapshot(reason);

                prevConfigRef.current = {
                    time: localSettings.scheduleTime,
                    threshold: localSettings.thresholdDays
                };
            }
        }, 1200);

        return () => {
             if (debounceTimer.current) clearTimeout(debounceTimer.current);
        };
    }, [
        localSettings.scheduleEnabled, 
        criticalInstrumentsHash, 
        isOpen, 
        handleSyncServerSnapshot,
        localSettings.scheduleTime,
        localSettings.thresholdDays
    ]);

    useEffect(() => {
        if (!isOpen || !localSettings.scheduleEnabled) return;
        
        const periodicInterval = setInterval(() => handleSyncServerSnapshot("periyodik"), 10 * 60 * 1000);

            clearInterval(periodicInterval);
        };

        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    };

        const events = new Map();

            const key = dateStr.substring(0, 10);
            if (!events.has(key)) {
                events.set(key, []);
            }
            events.get(key).push(event);
        };

        devicesToDisplay.forEach(instrument => {

        return events;
    }, [devicesToDisplay]);

    const handlePrevMonth = () => setCurrentDate(d => new Date(d.getFullYear(), d.getMonth() - 1, 1));
    const handleNextMonth = () => setCurrentDate(d => new Date(d.getFullYear(), d.getMonth() + 1, 1));
    const handleToday = () => setCurrentDate(new Date());

            // try to open exact instrument detail via prop
            const target = (instruments || []).find(i => 
                (instrument.id && i.id === instrument.id) || 
                (instrument.serialNumber && i.serialNumber === instrument.serialNumber)
            );
            if (typeof onOpenInstrument === 'function' && target) {
                onOpenInstrument(target.id);
                if (typeof onClose === 'function') onClose();
                return;
            }
        } catch(e) { /* fallback below */ }
        // fallback: go to instruments list filtered by serial
        if (typeof onNavigate === 'function') {
            onNavigate('instruments', { searchTerm: instrument.serialNumber || instrument.id || '' });
        }
    
    };

    const handleExportICS = () => {
        const calName = "Kalibrasyon Takvimi";
        let icsString = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//KalibrasyonTakip//NONSGML v1.0//EN\r\nCALSCALE:GREGORIAN\r\nX-WR-CALNAME:${calName}\r\n`;

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        for (const [dateStr, events] of eventsByDate.entries()) {
            const eventDate = new Date(dateStr);
            if (eventDate.getFullYear() === year && eventDate.getMonth() === month) {
                events.filter(e => e.type === 'next').forEach(event => {
                    const dt = dateStr.replace(/-/g, '');
                    const nextDay = new Date(eventDate);
                    nextDay.setDate(nextDay.getDate() + 1);
                    const dtEnd = dateKeyOf(nextDay).replace(/-/g, '');
                    
                    icsString += `BEGIN:VEVENT\r\n`;
                    icsString += `DTSTAMP:${new Date().toISOString().replace(/[-:.]/g, '')}Z\r\n`;
                    icsString += `UID:${event.id}-${dt}@kalibrasyon.takip\r\n`;
                    icsString += `DTSTART;VALUE=DATE:${dt}\r\n`;
                    icsString += `DTEND;VALUE=DATE:${dtEnd}\r\n`;
                    icsString += `SUMMARY:Kalibrasyon: ${event.name} (SN: ${event.serialNumber})\r\n`;
                    icsString += `DESCRIPTION:Cihaz: ${event.name}\\nSeri No: ${event.serialNumber}\\nDurum: ${event.status}\r\n`;
                    icsString += `END:VEVENT\r\n`;
                });
            }
        }
        icsString += `END:VCALENDAR`;

        const blob = new Blob([icsString], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Kalibrasyon_Takvimi_${year}_${String(month + 1).padStart(2, '0')}.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    const monthStart = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    const monthEnd = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
    const startDate = new Date(monthStart);
    const dayOfWeek = (startDate.getDay() + 6) % 7; // Monday is 0
    startDate.setDate(startDate.getDate() - dayOfWeek);

    const weeks = [];
    let currentDay = new Date(startDate);

    for (let i = 0; i < 6; i++) {
        const week = [];
        for (let j = 0; j < 7; j++) {
            week.push(new Date(currentDay));
            currentDay.setDate(currentDay.getDate() + 1);
        }
        weeks.push(week);
        if (currentDay > monthEnd && weeks.length >= 4) break;
    }

    const dayNames = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];

    const EventChip = ({ event, onClick }) => {
        const colors = {
            'last': { dot: 'bg-slate-400', text: 'text-slate-600 dark:text-slate-300', bg: 'bg-slate-100 dark:bg-slate-700' },
            'next': {
                [CalibrationStatus.OK]: { dot: 'bg-green-500', text: 'text-green-800 dark:text-green-200', bg: 'bg-green-100 dark:bg-green-900/50' },
                [CalibrationStatus.DUE_SOON]: { dot: 'bg-yellow-500', text: 'text-yellow-800 dark:text-yellow-200', bg: 'bg-yellow-100 dark:bg-yellow-900/50' },
                [CalibrationStatus.OVERDUE]: { dot: 'bg-red-500', text: 'text-red-800 dark:text-red-200', bg: 'bg-red-100 dark:bg-red-900/50' },
                [CalibrationStatus.PENDING]: { dot: 'bg-gray-500', text: 'text-gray-800 dark:text-gray-200', bg: 'bg-gray-100 dark:bg-gray-900/50' },
            }
        };
        const colorSet = event.type === 'next' ? (colors.next[event.status] || colors.next[CalibrationStatus.PENDING]) : colors.last;
        const prefix = event.type === 'last' ? 'Son Kal.' : 'Sıradaki Kal.';

        return e('button', {
            onClick: (evt) => { try { evt && evt.stopPropagation && evt.stopPropagation(); evt && evt.preventDefault && evt.preventDefault(); } catch(e){}; onClick(event); },
            className: `flex items-center gap-1.5 w-full text-left p-1 rounded-md text-xs font-medium ${colorSet.bg} hover:ring-2 ring-sky-500 transition-all`,
            title: `${prefix}: ${event.name} (SN: ${event.serialNumber})`
        },
            e('div', { className: `w-2 h-2 rounded-full flex-shrink-0 ${colorSet.dot}` }),
            e('span', { className: `truncate ${colorSet.text}` }, `${event.name} (SN: ${event.serialNumber})`)
        );
    };
    
    useEffect(() => {
        const handleKeyDown = (e) => {
            if (e.key === 'Escape') {
                onClose();
            }
        };

        if (isOpen) {
            window.addEventListener('keydown', handleKeyDown);
        }

        return () => {
            window.removeEventListener('keydown', handleKeyDown);
        };
    }, [isOpen, onClose]);


    return e(Modal, { isOpen, onClose, title: "Takvim", size: "max-w-7xl" },
        e("div", { className: "flex flex-col h-[75vh]" },
            e("header", { className: "flex items-center justify-between p-2 border-b dark:border-slate-700" },
                e("div", { className: "flex items-center gap-2" },
                    e("button", { onClick: handlePrevMonth, className: "p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700" }, e(ChevronLeftIcon, {})),
                    e("button", { onClick: handleNextMonth, className: "p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700" }, e(ChevronRightIcon, {})),
                    e("button", { onClick: handleToday, className: "px-4 py-1.5 text-sm font-semibold rounded-md hover:bg-slate-100 dark:hover:bg-slate-700" }, "Bugün")
                ),
                e("h3", { className: "text-lg font-semibold" },
                    new Intl.DateTimeFormat('tr-TR', { year: 'numeric', month: 'long' }).format(currentDate)
                ),
                e("button", { onClick: handleExportICS, className: "flex items-center gap-2 px-4 py-1.5 text-sm font-semibold rounded-md hover:bg-slate-100 dark:hover:bg-slate-700" },
                    e(DocumentArrowDownIcon, { className: "w-4 h-4" }),
                    "Dışa Aktar (.ics)"
                )
            ),
            
            
            // Ay/Yıl seçicileri (navigasyon)
            e("div", { className: "flex items-center justify-end gap-2 mt-2" },
                e("select", {
                    value: (new Date(currentDate)).getMonth() + 1,
                    onChange: (ev) => {
                        const m = parseInt(ev.target.value, 10) - 1;
                        const d = new Date(currentDate);
                        const y = d.getFullYear();
                        setCurrentDate(new Date(y, m, 1));
                    },
                    className: "px-3 py-1.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100"
                },
                    ...Array.from({length:12}, (_,i) => e("option", { key: i+1, value: i+1 },
                        new Intl.DateTimeFormat('tr-TR', { month: 'long' }).format(new Date(2025, i, 1))
                    ))
                ),
                e("select", {
                    value: (new Date(currentDate)).getFullYear(),
                    onChange: (ev) => {
                        const y = parseInt(ev.target.value, 10);
                        const d = new Date(currentDate);
                        setCurrentDate(new Date(y, d.getMonth(), 1));
                    },
                    className: "px-3 py-1.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100"
                },
                    ...Array.from({length:21}, (_,idx) => {
                        const base = (new Date(currentDate)).getFullYear();
                        const year = base - 10 + idx;
                        return e("option", { key: year, value: year }, String(year));
                    })
                )
            ),
            e("div", { className: "grid grid-cols-7 flex-grow" },
                dayNames.map(day => e("div", { key: day, className: "text-center font-semibold text-sm p-2 border-r border-b dark:border-slate-700" }, day)),
                weeks.flat().map((day, index) => {
                    const dateKey = dateKeyOf(day);
                    const dayEvents = eventsByDate.get(dateKey) || [];
                    const isCurrentMonth = day.getMonth() === currentDate.getMonth();
                    const isToday = dateKeyOf(day) === dateKeyOf(new Date());

                    return e("div", {
                        key: index,
                        onClick: () => onDayClick && onDayClick(dateKey), className: `relative p-1.5 border-r border-b dark:border-slate-700 flex flex-col gap-1 overflow-y-auto ${!isCurrentMonth ? 'bg-slate-50 dark:bg-slate-800/50' : ''}`
                    },
                        e("span", {
                            className: `text-xs font-semibold ${isToday ? 'bg-sky-600 text-white rounded-full w-5 h-5 flex items-center justify-center' : ''} ${!isCurrentMonth ? 'text-slate-400' : ''}`
                        }, day.getDate()),
                        e("div", { className: "flex flex-col gap-1" },
                            dayEvents.map((event, i) => e(EventChip, { key: i, event: event, onClick: handleEventClick }))
                        )
                    );
                })
            )
        )
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));

</script>
<script type="module" src="/index.tsx"></script>

  <!-- App Version Badge -->
  <div id="app-version" class="fixed bottom-3 right-3 z-40 pointer-events-none">
    <span class="inline-block px-2 py-1 text-xs rounded border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 shadow-sm">
      Caltrack ver10.9.3
    </span>
  </div>

</body>
</html>
